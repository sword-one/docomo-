name: 毎朝の料金・機種チェック
on:
  schedule:
    - cron: "0 20 * * *"   # 毎日 5:00（日本時間）
  workflow_dispatch: {}     # 手動でも実行できる
permissions:
  contents: write
concurrency: daily-update
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ドコモ公式サイトから取得
        run: python update/daily_update.py
      - name: 変更があれば保存
        run: |
          git config user.name "mitsumori-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "自動更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d')"
          git push
