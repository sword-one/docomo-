<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>簡易見積書</title>
<style>
:root { --navy:#1b3f73; --line:#c9d3e3; --bg:#f4f6fa; --red:#c62828; }
* { box-sizing: border-box; }
body { margin:0; font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif; color:#222; background:var(--bg); font-size:15px; }
header.bar { background:var(--navy); color:#fff; padding:10px 16px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; position:sticky; top:0; z-index:5; }
header.bar h1 { font-size:18px; margin:0 12px 0 0; }
header.bar select, header.bar input { font-size:15px; padding:6px 8px; border-radius:6px; border:none; }
header.bar .sp { flex:1; }
header.bar #store { max-width:250px; } header.bar #customer { width:150px !important; } header.bar #staff { width:100px !important; }
.card { scroll-margin-top:70px; }
.btn { border:1px solid var(--navy); background:#fff; color:var(--navy); border-radius:8px; padding:8px 12px; font-size:15px; cursor:pointer; font-weight:700; }
.btn.main { background:#fff; color:var(--navy); border-color:#fff; }
.btn.danger { color:var(--red); border-color:var(--red); }
.btn.armed { background:var(--red) !important; color:#fff !important; border-color:var(--red) !important; }
main { padding:12px 16px 120px; max-width:1100px; margin:0 auto; }
.tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
.tab { padding:8px 14px; border-radius:8px 8px 0 0; background:#dde4f0; cursor:pointer; font-weight:700; border:none; font-size:15px; }
.tab.on { background:#fff; color:var(--navy); box-shadow:0 -2px 0 var(--navy) inset; }
.card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:12px; }
.card h2 { font-size:16px; margin:0 0 8px; color:var(--navy); }
.row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.chip { border:1.5px solid var(--line); background:#fff; border-radius:8px; padding:8px 12px; cursor:pointer; font-size:14px; line-height:1.3; text-align:center; }
.chip small { display:block; color:#555; font-size:12px; }
.chip.on { border-color:var(--navy); background:var(--navy); color:#fff; }
.chip.on small { color:#dde4f0; }
.grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:12px; }
label.ck { display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px dashed #e3e7ee; }
label.ck span.p { margin-left:auto; font-weight:700; white-space:nowrap; }
input[type=number], input[type=text], select { font-size:15px; padding:6px 8px; border:1px solid #b9c4d6; border-radius:6px; }
input.yen { width:110px; text-align:right; }
.note { font-size:12px; color:#666; }
.warn { color:var(--red); font-weight:700; }
.sum { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:2px solid var(--navy); padding:8px 16px; display:flex; gap:18px; align-items:center; flex-wrap:wrap; z-index:5; }
.sum b { font-size:20px; color:var(--navy); }
table.kv { width:100%; border-collapse:collapse; font-size:14px; }
table.kv td { padding:4px 6px; border-bottom:1px solid #eef1f6; }
table.kv td.r { text-align:right; white-space:nowrap; }
/* #print は #pv（プレビュー）の中に表示 */
.wtag { font-size:11px; border-radius:4px; padding:1px 6px; margin-left:4px; } .wtag.today { background:#fde8e8; color:var(--red); } .wtag.next { background:#e8eef8; color:var(--navy); }
.cardb { margin-top:6px; padding:6px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; color:#222; font-size:13px; } .cardb.on { border:2px solid var(--navy); background:#eef2f9; } .cardb small { display:block; color:#666; font-size:11px; }
.devimg { text-align:center; margin:8px 0 0; } .devimg img { max-height:150px; max-width:220px; object-fit:contain; }
.og { font-weight:700; color:var(--navy); margin:12px 0 2px; }
details.others { margin-top:12px; border:1.5px solid var(--line); border-radius:10px; padding:4px 12px 8px; background:#fafbfd; }
details.others > summary { cursor:pointer; font-weight:700; color:var(--navy); padding:8px 0; min-height:30px; list-style:none; }
details.others > summary::before { content:"＋ "; } details.others[open] > summary::before { content:"－ "; }
/* 割引の欄 */
.drow { display:grid; grid-template-columns:150px 1fr 110px; gap:10px; align-items:center; padding:10px 0; border-bottom:1px solid #eef1f6; }
.drow .dt { font-weight:700; font-size:14px; }
.drow .ds { font-size:12px; color:#666; margin-top:4px; line-height:1.4; }
.drow .da { text-align:right; } .drow .da small { display:block; font-size:11px; color:#666; }
.dv { font-size:16px; color:var(--red); } .dv.off { color:#aaa; font-weight:400; font-size:14px; }
.seg { display:inline-flex; flex-wrap:wrap; border:1.5px solid var(--line); border-radius:10px; overflow:hidden; background:#fff; vertical-align:middle; }
.seg button { border:none; border-right:1px solid var(--line); background:#fff; padding:8px 14px; font-size:15px; min-height:42px; cursor:pointer; touch-action:manipulation; color:#222; }
.seg button:last-child { border-right:none; }
.seg button.on { background:var(--navy); color:#fff; font-weight:700; }
.seg button:disabled { color:#bbb; background:#f6f6f6; cursor:not-allowed; } .seg button.on:disabled { background:#9aa7bd; color:#fff; }
.step { display:inline-flex; align-items:center; gap:6px; margin-left:10px; font-size:13px; color:#444; vertical-align:middle; }
.step button { width:40px; height:40px; border:1.5px solid var(--line); border-radius:8px; background:#fff; font-size:18px; cursor:pointer; touch-action:manipulation; }
.step b { min-width:20px; text-align:center; font-size:16px; }
.dtot { text-align:right; padding:10px 0 2px; font-size:14px; } .dtot b { font-size:18px; color:var(--red); } .dtot small { display:block; color:#666; }
@media (max-width:700px) { .drow { grid-template-columns:1fr auto; } .drow .dc { grid-column:1 / -1; grid-row:2; } }
/* 料金プラン選び */
.sec-t { font-size:13px; font-weight:700; color:#555; margin:10px 0 6px; }
.pgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:8px; }
.pgrid.sub { grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); }
.pcard { border:1.5px solid var(--line); background:#fff; border-radius:10px; padding:10px 12px; cursor:pointer; text-align:left; line-height:1.35; min-height:44px; touch-action:manipulation; }
.pcard .nm { font-weight:700; font-size:15px; }
.pcard .pr { font-size:13px; color:var(--navy); font-weight:700; margin-top:2px; }
.pcard .tg { font-size:12px; color:#666; margin-top:2px; }
.pgrid.sub .pcard { padding:8px 10px; } .pgrid.sub .pcard .nm { font-size:14px; }
.pcard { border-left:6px solid var(--pc, var(--navy)); }
.pcard.on { background:#fff; border-color:var(--pc, var(--navy)); box-shadow:0 0 0 2.5px var(--pc, var(--navy)) inset; }
.plogo { height:30px; display:flex; align-items:center; margin-bottom:4px; } .plogo img { max-height:30px; max-width:100%; object-fit:contain; }
.plogo .ptxt { font-weight:800; font-size:15px; color:var(--pc, var(--navy)); line-height:1.2; }
.plogo.big { height:38px; display:inline-flex; vertical-align:middle; margin:0 8px 0 0; } .plogo.big img { max-height:38px; max-width:230px; } .plogo.big .ptxt { font-size:19px; }
.selplan { border-left:8px solid var(--pc, var(--navy)) !important; background:#fff !important; }
.ptabs { display:flex; gap:6px; border-bottom:2px solid var(--navy); margin-bottom:4px; }
.ptabs button { border:none; background:#dde4f0; padding:10px 16px; border-radius:8px 8px 0 0; font-size:15px; font-weight:700; cursor:pointer; min-height:44px; color:#222; }
.ptabs button.on { background:var(--navy); color:#fff; }
.selplan { display:flex; align-items:center; justify-content:space-between; gap:10px; background:#eef2f9; border:1.5px solid var(--navy); border-radius:10px; padding:10px 12px; }
.selplan .nm { font-size:18px; font-weight:800; color:var(--navy); } .selplan .tg { font-size:13px; color:#555; }
.tgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; }
.tcard { border:1.5px solid var(--line); background:#fff; border-radius:10px; padding:10px; cursor:pointer; text-align:center; min-height:44px; touch-action:manipulation; }
.tcard .lb { font-size:14px; } .tcard .yen { font-size:20px; font-weight:800; color:var(--navy); margin-top:2px; }
.tcard.on { background:var(--navy); border-color:var(--navy); color:#fff; } .tcard.on .yen { color:#fff; }
.news { background:#fff; border:1px solid var(--line); border-left:5px solid var(--navy); border-radius:8px; padding:8px 12px; margin-bottom:10px; font-size:14px; }
.news.bad { border-left-color:var(--red); }
.news summary { cursor:pointer; font-weight:700; color:var(--navy); }
.news ul { margin:6px 0 0; padding-left:20px; } .news li { margin:3px 0; }
.badge { display:inline-block; background:var(--red); color:#fff; font-size:11px; border-radius:4px; padding:1px 5px; margin-left:4px; vertical-align:middle; }
/* iPad（タッチ操作）向け */
html { -webkit-text-size-adjust:100%; }
* { -webkit-tap-highlight-color:transparent; }
.chip, .btn, .tab { min-height:44px; touch-action:manipulation; }
input[type=number], input[type=text], select, header.bar select, header.bar input { font-size:16px; min-height:40px; }
input[type=checkbox] { width:22px; height:22px; }
label.ck { min-height:44px; }
.sum { padding-bottom:calc(8px + env(safe-area-inset-bottom)); }

/* ===== 印刷（A4縦） ===== */

<script>
const yen = n => (Math.round(n)||0).toLocaleString("ja-JP") + "円";
const $ = id => document.getElementById(id);
const DEV = (typeof DEVICES !== "undefined") ? DEVICES : [];
// 毎朝の自動チェックで見つかった新プラン・料金変更を反映
if (typeof AUTO_PLANS !== "undefined") AUTO_PLANS.forEach(ap => { if (!PLANS.find(x => x.id === ap.id)) PLANS.push(ap); });
if (typeof PLAN_OVERRIDES !== "undefined") Object.entries(PLAN_OVERRIDES).forEach(([id, t]) => { const p = PLANS.find(x => x.id === id); if (!p) return;
  Object.entries(t).forEach(([i, v]) => { if (p.tiers[i] && p.tiers[i].price !== v) { p.tiers[i].price = v; p.changed = true; } }); });
function renderNews() {
  if (typeof UPDATES === "undefined" || !UPDATES) { $("news").innerHTML = ""; return; }
  const U = UPDATES, age = (Date.now() - new Date(U.checked_at.replace(" ", "T") + ":00+09:00")) / 86400000;
  const stale = age > 2;
  const items = (U.news || []).map(n => `<li>${esc(n.date.slice(5).replace("-", "/"))}　${esc(n.text)}</li>`).join("");
  $("news").innerHTML = `<div class="news ${!U.ok || stale ? "bad" : ""}">
    ${!U.ok ? `<div class="warn">⚠ ${esc(U.message)}</div>` : ""}
    ${stale ? `<div class="warn">⚠ 自動更新が${Math.floor(age)}日止まっています（最終チェック ${esc(U.checked_at)}）。担当者に連絡してください。</div>` : ""}
    ${items ? `<details><summary>📢 ドコモの更新情報（${(U.news || []).length}件・直近2週間）</summary><ul>${items}</ul></details>` : `<span class="note">📢 ドコモの料金・機種は毎朝自動でチェックしています（最終チェック ${esc(U.checked_at)}）。直近2週間の変更はありません。</span>`}
  </div>`;
}

function newLine(n) {
  return { label: "回線" + n, contract: "mnp", plan: "max", tier: 2, voice: "none", age: "none", hearty: false, kosodate: false, curCat: "", curModel: "",
    family: true, dcard: "none", hikari: false, denki: false, choki: "none", oyako: false,
    opts: {}, optAmt: {}, freeOpts: [{ name: "", price: 0 }],
    device: { use: true, cat: "", model: "", pay: "kaedoki", storeOn: false, manualPrice: null, atama: null, shitadori: 0, point: 0 },
    init: { jimu: true }, initAmt: {}, initWhen: {}, freeInit: [{ name: "", price: 0 }] };
}
let S = { lines: [newLine(1)], cur: 0, extra: 0, pay: "cash", props: {}, pin: {} };

function plan(l) { const p = PLANS.find(x => x.id === l.plan); if (l.tier >= p.tiers.length) l.tier = p.tiers.length - 1; const vs = VOICE[p.voice] || VOICE.none; if (!vs.find(v => v.id === l.voice)) l.voice = vs[0].id; return p; }
const tierOff = (p, l) => (p.noDiscTiers || []).includes(l.tier);                 // この段階は割引・回線数カウントの対象外（irumo 0.5GB）
const hikariOf = (p, l) => Array.isArray(p.hikari) ? (p.hikari[l.tier] || 0) : (p.hikari || 0);   // 光セット割は段階で額が違うプランがある
const dcardOf = (p, l) => tierOff(p, l) ? null : p.dcard;
const oid = p => p.optLike || p.id;                                              // オプションの出し方を合わせるプラン
function familyCount() { return S.lines.filter(l => { const p = plan(l); return p && p.count && l.family && !tierOff(p, l); }).length + Number(S.extra || 0); }

// ---------- 計算 ----------
function calc(l) {
  const p = plan(l), t = p.tiers[Math.min(l.tier, p.tiers.length - 1)];
  const r = { base: t.price, disc: [], voice: 0, opts: [], promos: [], dev: null };
  const fc = familyCount();
  const hearty = l.hearty && HEARTY.plans[p.id] != null;
  if (hearty) r.disc.push(["ハーティ割引", HEARTY.plans[p.id]]);
  if (p.autoDisc && !hearty) p.autoDisc.forEach(x => r.disc.push([x[0], x[1]]));   // 自動で付く割引（はじめてスマホISP割。ハーティ割引とは併用不可）
  const ag = AGE_DISCOUNTS[l.age];
  if (ag && ag.plans[p.id]) { const a = ag.plans[p.id]; r.disc.push([ag.name + "（最大" + ag.months + "か月）", a[Math.min(l.tier, a.length - 1)], ag.months]); }
  const kosodate = kosodateOn(l, p);
  if (kosodate && KOSODATE.plans[p.id]) r.disc.push(["子育てサポート割引", KOSODATE.plans[p.id]]);
  if (!hearty && !kosodate && p.family && l.family && fc >= 2) r.disc.push(["みんなドコモ割（" + (p.family[0] === p.family[1] ? "2回線以上" : fc >= 3 ? "3回線以上" : "2回線") + "）", fc >= 3 ? p.family[1] : p.family[0]]);
  const cardOff = c => (!hearty && dcardOf(p, l) && DCARD[c]) ? p.dcard[DCARD[c].off] : 0;   // dカードお支払割の額
  if (cardOff(l.dcard)) r.disc.push(["dカードお支払割（" + DCARD[l.dcard].short + "）", cardOff(l.dcard)]);
  if (hikariOf(p, l) && l.hikari) r.disc.push(["ドコモ光／home 5G セット割", hikariOf(p, l)]);
  // 年齢の割引（U22/U29/60歳以上割）の期間中は、でんきセット割・長期利用割は適用されず、期間後に再開（提供条件書）
  const agOn = ag && ag.plans[p.id] ? ag.months : 0;
  r.late = [];
  const addDL = (name, amt) => agOn ? r.late.push([name, amt, agOn]) : r.disc.push([name, amt]);
  if (p.denki && l.denki) addDL("ドコモでんき セット割", p.denki);
  if (p.choki && l.choki !== "none") addDL("長期利用割（" + (l.choki === "20" ? "20年以上" : "10年以上") + "）", l.choki === "20" ? 220 : 110);
  if (p.oyako && l.oyako) r.disc.push(["親子割（最大12か月）", p.oyako[Math.min(l.tier, 1)], 12]);
  const v = (VOICE[p.voice] || VOICE.none).find(x => x.id === l.voice) || VOICE[p.voice][0];
  r.voiceName = v.name; r.voice = v.price;
  if (p.senior60Kakeho && l.voice === "kakeho" && l.age === "s60") { r.voice = SENIOR60_KAKEHO; r.voiceName = "かけ放題（60歳以上）"; }
  if (hearty && p.voice === "std" && HEARTY.voice[l.voice] != null) { r.voice = HEARTY.voice[l.voice]; r.voiceName += "（ハーティ割引）"; }
  else if (kosodate && l.voice !== "none") { r.voice = Math.max(0, r.voice - KOSODATE.voiceOff); r.voiceName += "（子育てサポート割引）"; }
  OPTIONS.forEach(o => { if (!l.opts[o.id] || !optOK(o, p, l) || packOf(l, o, p)) return;
    const e = optEff(l, o, p);
    const ht = HOSHO_OPT[o.id] ? hoshoTarget(l) : null;   // 補償はどの機種の金額かを書く
    r.opts.push([o.name + (ht && ht.h ? "（" + ht.name.replace("（店頭のみ）", "") + "）" : "") + (e.why ? "（" + e.why + "）" : ""), e.amt]);
    if (e.promo) { r.opts.push([e.promo.name, -e.promo.amt]); r.promos.push(e.promo); } });
  l.freeOpts.forEach(f => { if (f.name || f.price) r.opts.push([f.name || "その他", Number(f.price || 0)]); });
  const discSum = r.disc.reduce((a, b) => a + b[1], 0);
  r.planNet = Math.max(0, r.base - discSum);
  r.monthlyCharge = r.planNet + r.voice + r.opts.reduce((a, b) => a + b[1], 0);
  // 端末
  r.dev = devCalc(l);
  r.monthly = r.monthlyCharge + (r.dev ? r.dev.monthly : 0);
  // dカードのおトク（割引＋料金のポイント還元）。カードごとに「持った場合」を計算
  const billBase = r.planNet + cardOff(l.dcard);   // dカード割引を引く前の基本料
  r.cards = !dcardOf(p, l) ? [] : ["general", "goldu", "gold", "platinum"].map(c => {
    const off = cardOff(c), bill = Math.max(0, billBase - off) + r.voice;                     // 割引後の基本料＋通話（税込）
    const pts = DCARD_NO_POINT.includes(p.id) ? 0 : Math.floor(Math.round(bill / 1.1) / 1000) * 1000 * DCARD[c].rate;
    return { id: c, name: DCARD[c].name, off, pts: Math.round(pts), total: off + Math.round(pts), fee: DCARD[c].fee, sel: l.dcard === c };
  }).sort((a, b) => ["general", "goldu", "gold", "platinum"].indexOf(a.id) - ["general", "goldu", "gold", "platinum"].indexOf(b.id));
  // ポイ活プラン：還元の上限まで貯めた場合の実質
  const pk = POIKATSU[p.id];
  r.poikatsu = pk ? { cap: pk.cap, rate: pk.rates[l.dcard] || pk.rates.none, need: Math.ceil(pk.cap / ((pk.rates[l.dcard] || pk.rates.none) / 100)), jisshitsu: (() => { const nuki = Math.round(r.planNet / 1.1);   // 割引後の基本料（税抜）からポイント分を引き、税を掛け直す（公式の「実質」と同じ計算）
      return r.monthly - r.planNet + Math.round(Math.max(0, nuki - pk.cap) * 1.1); })() } : null;
  // 期間限定の割引が終わった後の月額
  const ends = [...new Set(r.disc.filter(d => d[2]).map(d => d[2]).concat(r.promos.map(x => x.months)))].sort((a, b) => a - b);
  r.steps = ends.map(m => { const ds = r.disc.filter(d => !d[2] || d[2] > m).reduce((a, b) => a + b[1], 0) + r.late.filter(d => m >= d[2]).reduce((a, b) => a + b[1], 0);
    const pr = r.promos.filter(x => x.months <= m).reduce((a, b) => a + b.amt, 0);
    return { from: m + 1, monthly: r.monthly - r.planNet + Math.max(0, r.base - ds) + pr }; });
  // 初期費用
  r.init = [];
  if (l.contract !== "plan" && l.init.jimu && p.id !== "ahamo") r.init.push(hearty ? ["契約事務手数料（ハーティ割引で無料）", 0, "next"] : ["契約事務手数料", 4950, "next"]);
  INITIAL.filter(i => !i.auto && l.init[i.id]).forEach(i => { const w = initWhen(l, i);
    r.init.push(hearty && HEARTY.initFree.includes(i.id) ? [i.name + "（ハーティ割引で無料）", 0, w] : i.choices ? [i.name + "（" + (i.choices.find(c => c.p === Number(l.initAmt[i.id] ?? i.choices[0].p)) || i.choices[0]).l + "）", Number(l.initAmt[i.id] ?? i.choices[0].p), w] : [i.name, i.input ? Number(l.initAmt[i.id] || 0) : i.price, w]); });
  l.freeInit.forEach(f => { if (f.name || f.price) r.init.push([f.name || "その他", Number(f.price || 0), "today"]); });
  if (r.dev && r.dev.atama !== null) r.init.push(["頭金", r.dev.atama, "today"]);
  if (r.dev && r.dev.pay === "ikkatsu" && r.dev.total !== null) r.init.push(["端末代金（一括）", r.dev.total - (r.dev.atama || 0), "today"]);
  r.initTotal = r.init.reduce((a, b) => a + b[1], 0);
  r.today = r.init.filter(x => x[2] === "today").reduce((a, b) => a + b[1], 0);     // 当日のお支払い
  r.nextInit = r.init.filter(x => x[2] === "next").reduce((a, b) => a + b[1], 0);   // 翌月のご請求（初期費用分）
  return r;
}

let planTab = "now";      // プラン一覧のタブ（now＝いまのプラン／old＝旧プラン）
// プランのロゴ（公式の画像）。ロゴの無いプランは、プランの色の帯＋名前で見分ける
function planLogo(x, big) {
  return x.logo ? `<div class="plogo ${big ? "big" : ""}"><img src="${x.logo}" alt="${esc(x.name)}" onerror="this.outerHTML='<span class=&quot;ptxt&quot;>${esc(x.name)}</span>'"></div>`
                : `<div class="plogo ${big ? "big" : ""}"><span class="ptxt">${esc(x.name)}</span></div>`;
}
let planOpen = false;
let othersOpen = false;   // 「その他のオプション」を開いているか   // プラン一覧を開いているか（選んだら閉じて、データ量だけ見せる）
const MAIN_PLANS = ["max", "poimax", "poi20", "mini2", "ahamo"];
const PLAN_TAG = { max: "使った分だけ・無制限まで", poimax: "無制限＋dポイント還元", poi20: "20GBまで＋dポイント還元", mini2: "少しだけ使う人・〜12GB",
  ahamo: "オンライン手続き・〜120GB", u15: "5〜15歳のお子さま", keitai2: "ケータイ（ガラケー）", kids3: "キッズケータイ", dataplus: "タブレット等の2台目" };
// オプションの実際の月額（割引・特典を反映）。画面の表示と合計の計算の両方でこれを使う
function tokutenFree(l, p) {   // 選べる特典で0円になるオプション（p.tokuten 個まで）
  if (!p.tokuten) return new Set();
  return new Set(OPTIONS.filter(o => o.tokuten && l.opts[o.id] && optOK(o, p, l)).sort((a, b) => optAmt(l, b) - optAmt(l, a)).slice(0, p.tokuten).map(o => o.id));   // 高い方から2つを0円に（お客様に一番おトク）
}
function optEff(l, o, p) {
  const base = optAmt(l, o);
  const r = { amt: base, base, why: "", promo: null };
  if (o.tokuten && p.tokuten) {
    const free = tokutenFree(l, p);
    if (l.opts[o.id] ? free.has(o.id) : free.size < p.tokuten) { r.amt = 0; r.why = "選べる特典で0円"; }

  } else {

    ctl += row("② 金額は", pk(man, "ここで手入力", "pmSet('src','man')") + pk(!man, "見積の内容で計算", "pmSet('src','est')"));
    if (sheet === "dcard") ctl += row("③ どのカード？", pk(M.card !== "platinum", "dカード GOLD", "pmSet('card','gold')") + pk(M.card === "platinum", "dカード PLATINUM", "pmSet('card','platinum')"));
    if (sheet === "dcard" && man) {
      ctl += row("④ 回線数", stp("c550", `<b class="a">${yen(PM_CARD.n[0])}</b> 引き<small>新しいプラン（MAX・ポイ活・mini2・mini）</small>`) + stp("c187", `<b class="a">${yen(PM_CARD.o[0])}</b> 引き<small>前のプラン（eximo・irumo・ギガホなど）</small>`));
      ctl += row("⑤ 毎月の料金", pin("pm", "bill", "基本料金＋通話料の合計（税込・だいたい）", "例 8000") + `<small>入れると、たまるポイントも出ます（空でもOK）。mini2・mini・irumo・ahamo の回線はポイントの対象外なので、入れないでください。</small>`);
      const nw = M.now === "gold" && M.card !== "platinum" ? "none" : (M.now || "none");
      ctl += row("⑥ 今のお支払い", pk(nw === "none", "口座振替・ほかのカード", "pmSet('now','none')") + pk(nw === "general", "dカード（年会費無料）", "pmSet('now','general')") + (M.card === "platinum" ? pk(nw === "gold", "dカード GOLD", "pmSet('now','gold')") : ""));
    }
    if (sheet === "hikari") {
      if (man) ctl += row("③ 回線数", stp("h1210", `<b class="a">1,210円</b> 引き<small>新しいプラン（MAX・ポイ活・mini2・mini）</small>`) + stp("h1100", `<b class="a">1,100円</b> 引き<small>前のプラン（eximo・irumo 3GB〜・ギガホなど）</small>`) + stp("h550", `<b class="a">550円</b> 引き<small>5Gギガライト（1GB超〜3GB）</small>`));
      ctl += row(man ? "④ お住まい" : "③ お住まい", homeNet);
    }
    if (sheet === "denki") {
      if (man) ctl += row("③ 回線数", stp("d110", `<b class="a">${yen(PM_DENKI)}</b> 引き<small>新しいプラン（MAX・ポイ活・mini2・mini）。前のプランは割引なし</small>`));
      ctl += row(man ? "④ 電気・ガス" : "③ 電気・ガス", denGas);
    }
  }
  ctl += `<div class="hint">「印刷する」で印刷画面が開かない時は、iPadのSafariなら画面上の共有ボタン（□↑）→「プリント」で印刷できます。</div>`;
  $("pvctl").innerHTML = ctl;
  $("pvttl").textContent = isProp ? "ご提案" : "印刷プレビュー";
  $("pvcount").textContent = `A4縦 ${pages.length}枚`;
  $("pv").classList.add("open"); document.body.classList.add("pvopen"); if (mode) $("pv").scrollTop = 0;
  fitPages();
}
// 各ページをA4縦1枚（印刷できる範囲 190×277mm）に収める。はみ出す時だけ縮小
function fitPages() {
  const mm = 96 / 25.4, H = 262 * mm;
  document.querySelectorAll("#print .pg").forEach(pg => {
    let z = 1; pg.style.zoom = 1; pg.style.width = "190mm";
    for (let k = 0; k < 30; k++) {
      const h = pg.getBoundingClientRect().height;
      if (h <= H) break;
      z = Math.max(0.35, z * Math.sqrt(H / h) * 0.99); pg.style.zoom = z; pg.style.width = (190 / z) + "mm";
      if (z === 0.35) break;
    }
  });
}
$("store").innerHTML = STORES.map(s => `<option>${s}</option>`).join("");
try { const sv = localStorage.getItem("mitsumori_store"); if (sv) $("store").value = sv; } catch (e) {}
$("store").onchange = () => { try { localStorage.setItem("mitsumori_store", $("store").value); } catch (e) {} };
$("asof").textContent = "料金データ：" + DATA_AS_OF + (typeof DEVICES_AS_OF !== "undefined" ? "／機種代金：" + DEVICES_AS_OF : "");
renderNews();
render();
