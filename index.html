<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="簡易見積書">
<meta name="format-detection" content="telephone=no">
<title>簡易見積書</title>
<style>
:root { --navy:#1b3f73; --line:#c9d3e3; --bg:#f4f6fa; --red:#c62828; }
* { box-sizing: border-box; }
body { margin:0; font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif; color:#222; background:var(--bg); font-size:15px; }
header.bar { background:var(--navy); color:#fff; padding:10px 16px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; position:sticky; top:0; z-index:5; }
header.bar h1 { font-size:18px; margin:0 12px 0 0; }
header.bar select, header.bar input { font-size:15px; padding:6px 8px; border-radius:6px; border:none; }
header.bar .sp { flex:1; }
header.bar #store { max-width:250px; } header.bar #customer { width:150px !important; } header.bar #staff { width:100px !important; }
.card { scroll-margin-top:70px; }
.btn { border:1px solid var(--navy); background:#fff; color:var(--navy); border-radius:8px; padding:8px 12px; font-size:15px; cursor:pointer; font-weight:700; }
.btn.main { background:#fff; color:var(--navy); border-color:#fff; }
.btn.danger { color:var(--red); border-color:var(--red); }
.btn.armed { background:var(--red) !important; color:#fff !important; border-color:var(--red) !important; }
main { padding:12px 16px 120px; max-width:1100px; margin:0 auto; }
.tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
.tab { padding:8px 14px; border-radius:8px 8px 0 0; background:#dde4f0; cursor:pointer; font-weight:700; border:none; font-size:15px; }
.tab.on { background:#fff; color:var(--navy); box-shadow:0 -2px 0 var(--navy) inset; }
.card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:12px; }
.card h2 { font-size:16px; margin:0 0 8px; color:var(--navy); }
.row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.chip { border:1.5px solid var(--line); background:#fff; border-radius:8px; padding:8px 12px; cursor:pointer; font-size:14px; line-height:1.3; text-align:center; }
.chip small { display:block; color:#555; font-size:12px; }
.chip.on { border-color:var(--navy); background:var(--navy); color:#fff; }
.chip.on small { color:#dde4f0; }
.grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:12px; }
label.ck { display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px dashed #e3e7ee; }
label.ck span.p { margin-left:auto; font-weight:700; white-space:nowrap; }
input[type=number], input[type=text], select { font-size:15px; padding:6px 8px; border:1px solid #b9c4d6; border-radius:6px; }
input.yen { width:110px; text-align:right; }
.note { font-size:12px; color:#666; }
.warn { color:var(--red); font-weight:700; }
.sum { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:2px solid var(--navy); padding:8px 16px; display:flex; gap:18px; align-items:center; flex-wrap:wrap; z-index:5; }
.sum b { font-size:20px; color:var(--navy); }
table.kv { width:100%; border-collapse:collapse; font-size:14px; }
table.kv td { padding:4px 6px; border-bottom:1px solid #eef1f6; }
table.kv td.r { text-align:right; white-space:nowrap; }
#print { display:none; }
/* 料金プラン選び */
.sec-t { font-size:13px; font-weight:700; color:#555; margin:10px 0 6px; }
.pgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:8px; }
.pgrid.sub { grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); }
.pcard { border:1.5px solid var(--line); background:#fff; border-radius:10px; padding:10px 12px; cursor:pointer; text-align:left; line-height:1.35; min-height:44px; touch-action:manipulation; }
.pcard .nm { font-weight:700; font-size:15px; }
.pcard .pr { font-size:13px; color:var(--navy); font-weight:700; margin-top:2px; }
.pcard .tg { font-size:12px; color:#666; margin-top:2px; }
.pgrid.sub .pcard { padding:8px 10px; } .pgrid.sub .pcard .nm { font-size:14px; }
.pcard.on { background:var(--navy); border-color:var(--navy); color:#fff; }
.pcard.on .pr, .pcard.on .tg { color:#dde4f0; }
.selplan { display:flex; align-items:center; justify-content:space-between; gap:10px; background:#eef2f9; border:1.5px solid var(--navy); border-radius:10px; padding:10px 12px; }
.selplan .nm { font-size:18px; font-weight:800; color:var(--navy); } .selplan .tg { font-size:13px; color:#555; }
.tgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; }
.tcard { border:1.5px solid var(--line); background:#fff; border-radius:10px; padding:10px; cursor:pointer; text-align:center; min-height:44px; touch-action:manipulation; }
.tcard .lb { font-size:14px; } .tcard .yen { font-size:20px; font-weight:800; color:var(--navy); margin-top:2px; }
.tcard.on { background:var(--navy); border-color:var(--navy); color:#fff; } .tcard.on .yen { color:#fff; }
.news { background:#fff; border:1px solid var(--line); border-left:5px solid var(--navy); border-radius:8px; padding:8px 12px; margin-bottom:10px; font-size:14px; }
.news.bad { border-left-color:var(--red); }
.news summary { cursor:pointer; font-weight:700; color:var(--navy); }
.news ul { margin:6px 0 0; padding-left:20px; } .news li { margin:3px 0; }
.badge { display:inline-block; background:var(--red); color:#fff; font-size:11px; border-radius:4px; padding:1px 5px; margin-left:4px; vertical-align:middle; }
/* iPad（タッチ操作）向け */
html { -webkit-text-size-adjust:100%; }
* { -webkit-tap-highlight-color:transparent; }
.chip, .btn, .tab { min-height:44px; touch-action:manipulation; }
input[type=number], input[type=text], select, header.bar select, header.bar input { font-size:16px; min-height:40px; }
input[type=checkbox] { width:22px; height:22px; }
label.ck { min-height:44px; }
.sum { padding-bottom:calc(8px + env(safe-area-inset-bottom)); }

/* ===== 印刷（A4縦） ===== */
@page { size:A4 portrait; margin:10mm 10mm 10mm; }
@media print {
  body { background:#fff; font-size:10pt; }
  header.bar, main, .sum { display:none !important; }
  #print { display:block; }
  .pg { page-break-after:always; }
  .pg:last-child { page-break-after:auto; }
  .ph { display:flex; justify-content:space-between; align-items:flex-end; border-bottom:2px solid #000; padding-bottom:2mm; margin-bottom:3mm; }
  .ph h1 { font-size:18pt; margin:0; letter-spacing:.3em; }
  .ph .meta { font-size:9pt; text-align:right; line-height:1.5; }
  table.pt { width:100%; border-collapse:collapse; margin-bottom:3mm; }
  table.pt th, table.pt td { border:0.3mm solid #555; padding:1.2mm 2mm; font-size:9.5pt; }
  table.pt th { background:#e8e8e8; text-align:left; }
  table.pt td.r { text-align:right; white-space:nowrap; width:28mm; }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:4mm; }
  .tot { border:0.6mm solid #000; padding:2mm 3mm; margin-top:2mm; }
  .tot .big { font-size:16pt; font-weight:800; }
  .pn { font-size:8pt; color:#333; margin-top:2mm; line-height:1.5; }
  .line-block { break-inside:avoid; margin-bottom:4mm; }
  .lh { background:#000; color:#fff; padding:1mm 3mm; font-weight:700; font-size:11pt; }
}
</style>
<script>
// 毎日更新されるデータを、iPadに古いまま残さず必ず最新で読み込む
(function () { const v = Date.now(); ["data.js", "devices.js", "updates.js"].forEach(f => document.write('<script src="' + f + '?v=' + v + '"><\/script>')); })();
</script>
</head>
<body>
<header class="bar">
  <h1>簡易見積書</h1>
  <select id="store"></select>
  <input id="customer" type="text" placeholder="お客様名（任意）" style="width:160px">
  <input id="staff" type="text" placeholder="担当者" style="width:110px">
  <span class="sp"></span>
  <button class="btn" onclick="resetAll(this)">クリア</button>
  <button class="btn main" onclick="doPrint()">🖨 印刷（A4縦）</button>
</header>

<main>
  <div id="news"></div>
  <div class="tabs" id="tabs"></div>
  <div id="editor"></div>
  <p class="note" id="asof"></p>
</main>

<div class="sum" id="sumbar"></div>
<div id="print"></div>

<script>
const yen = n => (Math.round(n)||0).toLocaleString("ja-JP") + "円";
const $ = id => document.getElementById(id);
const DEV = (typeof DEVICES !== "undefined") ? DEVICES : [];
// 毎朝の自動チェックで見つかった新プラン・料金変更を反映
if (typeof AUTO_PLANS !== "undefined") AUTO_PLANS.forEach(ap => { if (!PLANS.find(x => x.id === ap.id)) PLANS.push(ap); });
if (typeof PLAN_OVERRIDES !== "undefined") Object.entries(PLAN_OVERRIDES).forEach(([id, t]) => { const p = PLANS.find(x => x.id === id); if (!p) return;
  Object.entries(t).forEach(([i, v]) => { if (p.tiers[i] && p.tiers[i].price !== v) { p.tiers[i].price = v; p.changed = true; } }); });
function renderNews() {
  if (typeof UPDATES === "undefined" || !UPDATES) { $("news").innerHTML = ""; return; }
  const U = UPDATES, age = (Date.now() - new Date(U.checked_at.replace(" ", "T") + ":00+09:00")) / 86400000;
  const stale = age > 2;
  const items = (U.news || []).map(n => `<li>${esc(n.date.slice(5).replace("-", "/"))}　${esc(n.text)}</li>`).join("");
  $("news").innerHTML = `<div class="news ${!U.ok || stale ? "bad" : ""}">
    ${!U.ok ? `<div class="warn">⚠ ${esc(U.message)}</div>` : ""}
    ${stale ? `<div class="warn">⚠ 自動更新が${Math.floor(age)}日止まっています（最終チェック ${esc(U.checked_at)}）。担当者に連絡してください。</div>` : ""}
    ${items ? `<details><summary>📢 ドコモの更新情報（${(U.news || []).length}件・直近2週間）</summary><ul>${items}</ul></details>` : `<span class="note">📢 ドコモの料金・機種は毎朝自動でチェックしています（最終チェック ${esc(U.checked_at)}）。直近2週間の変更はありません。</span>`}
  </div>`;
}

function newLine(n) {
  return { label: "回線" + n, contract: "mnp", plan: "max", tier: 2, voice: "none", age: "none", hearty: false,
    family: true, dcard: "none", hikari: false, denki: false, choki: "none", oyako: false,
    opts: {}, optAmt: {}, freeOpts: [{ name: "", price: 0 }],
    device: { use: true, cat: "", model: "", pay: "kaedoki", manualPrice: null, atama: null, shitadori: 0, point: 0 },
    init: { jimu: true }, initAmt: {}, freeInit: [{ name: "", price: 0 }] };
}
let S = { lines: [newLine(1)], cur: 0, extra: 0 };

function plan(l) { const p = PLANS.find(x => x.id === l.plan); if (l.tier >= p.tiers.length) l.tier = p.tiers.length - 1; const vs = VOICE[p.voice] || VOICE.none; if (!vs.find(v => v.id === l.voice)) l.voice = vs[0].id; return p; }
function familyCount() { return S.lines.filter(l => { const p = plan(l); return p && p.count && l.family; }).length + Number(S.extra || 0); }

// ---------- 計算 ----------
function calc(l) {
  const p = plan(l), t = p.tiers[Math.min(l.tier, p.tiers.length - 1)];
  const r = { base: t.price, disc: [], voice: 0, opts: [], dev: null };
  const fc = familyCount();
  const hearty = l.hearty && HEARTY.plans[p.id] != null;
  if (hearty) r.disc.push(["ハーティ割引", HEARTY.plans[p.id]]);
  const ag = AGE_DISCOUNTS[l.age];
  if (ag && ag.plans[p.id]) { const a = ag.plans[p.id]; r.disc.push([ag.name + "（最大" + ag.months + "か月）", a[Math.min(l.tier, a.length - 1)], ag.months]); }
  if (!hearty && p.family && l.family && fc >= 2) r.disc.push(["みんなドコモ割（" + (p.family[0] === p.family[1] ? "2回線以上" : fc >= 3 ? "3回線以上" : "2回線") + "）", fc >= 3 ? p.family[1] : p.family[0]]);
  if (!hearty && p.dcard && l.dcard !== "none") r.disc.push(["dカードお支払割（" + (l.dcard === "gold" ? "GOLD/PLATINUM" : "dカード") + "）", l.dcard === "gold" ? p.dcard[0] : p.dcard[1]]);
  if (p.hikari && l.hikari) r.disc.push(["ドコモ光／home 5G セット割", p.hikari]);
  if (p.denki && l.denki) r.disc.push(["ドコモでんき セット割", p.denki]);
  if (p.choki && l.choki !== "none") r.disc.push(["長期利用割（" + (l.choki === "20" ? "20年以上" : "10年以上") + "）", l.choki === "20" ? 220 : 110]);
  if (p.oyako && l.oyako) r.disc.push(["親子割（最大12か月）", p.oyako[Math.min(l.tier, 1)], 12]);
  const v = (VOICE[p.voice] || VOICE.none).find(x => x.id === l.voice) || VOICE[p.voice][0];
  r.voiceName = v.name; r.voice = v.price;
  if (p.senior60Kakeho && l.voice === "kakeho" && l.age === "s60") { r.voice = SENIOR60_KAKEHO; r.voiceName = "かけ放題（60歳以上）"; }
  if (hearty && p.voice === "std" && HEARTY.voice[l.voice] != null) { r.voice = HEARTY.voice[l.voice]; r.voiceName += "（ハーティ割引）"; }
  let tk = 0;
  OPTIONS.forEach(o => { if (!l.opts[o.id] || !optOK(o, p)) return;
    let amt = optAmt(l, o), nm = o.name;
    if (o.tokuten && p.tokuten && tk < p.tokuten) { tk++; amt = 0; nm += "（選べる特典で0円）"; }
    else if (o.freeWithVoice && p.voice === "std" && l.voice !== "none") { amt = 0; nm += "（通話オプション加入で割引）"; }
    r.opts.push([nm, amt]); });
  l.freeOpts.forEach(f => { if (f.name || f.price) r.opts.push([f.name || "その他", Number(f.price || 0)]); });
  const discSum = r.disc.reduce((a, b) => a + b[1], 0);
  r.planNet = Math.max(0, r.base - discSum);
  r.monthlyCharge = r.planNet + r.voice + r.opts.reduce((a, b) => a + b[1], 0);
  // 端末
  r.dev = devCalc(l);
  r.monthly = r.monthlyCharge + (r.dev ? r.dev.monthly : 0);
  // 期間限定の割引が終わった後の月額
  const ends = [...new Set(r.disc.filter(d => d[2]).map(d => d[2]))].sort((a, b) => a - b);
  r.steps = ends.map(m => { const ds = r.disc.filter(d => !d[2] || d[2] > m).reduce((a, b) => a + b[1], 0); return { from: m + 1, monthly: r.monthly - r.planNet + Math.max(0, r.base - ds) }; });
  // 初期費用
  r.init = [];
  if (l.contract !== "plan" && l.init.jimu && p.id !== "ahamo") r.init.push(hearty ? ["契約事務手数料（ハーティ割引で無料）", 0] : ["契約事務手数料（翌月請求）", 4950]);
  INITIAL.filter(i => !i.auto && l.init[i.id]).forEach(i => r.init.push([i.name, i.input ? Number(l.initAmt[i.id] || 0) : i.price]));
  l.freeInit.forEach(f => { if (f.name || f.price) r.init.push([f.name || "その他", Number(f.price || 0)]); });
  if (r.dev && r.dev.atama !== null) r.init.push(["頭金", r.dev.atama]);
  if (r.dev && r.dev.pay === "ikkatsu" && r.dev.total !== null) r.init.push(["端末代金（一括）", r.dev.total - (r.dev.atama || 0)]);
  r.initTotal = r.init.reduce((a, b) => a + b[1], 0);
  return r;
}

let planOpen = false;   // プラン一覧を開いているか（選んだら閉じて、データ量だけ見せる）
const MAIN_PLANS = ["max", "poimax", "poi20", "mini2", "ahamo"];
const PLAN_TAG = { max: "使った分だけ・無制限まで", poimax: "無制限＋dポイント還元", poi20: "20GBまで＋dポイント還元", mini2: "少しだけ使う人・〜12GB",
  ahamo: "オンライン手続き・〜120GB", u15: "5〜15歳のお子さま", keitai2: "ケータイ（ガラケー）", kids3: "キッズケータイ", dataplus: "タブレット等の2台目" };
function optOK(o, p) { return !o.plans || o.plans.includes(p.id); }
function optAmt(l, o) { return o.input ? Number(l.optAmt[o.id] || 0) : (o.choices ? Number(l.optAmt[o.id] ?? o.choices[0].p) : o.price); }
function devFind(l) { return DEV.find(d => d.name === l.device.model); }
function devPrice(d, contract) {
  if (!d) return null; const k = contract === "plan" ? "kihen" : contract; const pr = (d.prices || {})[k] || {};
  return pr;
}
function devCalc(l) {
  const dv = l.device; if (!dv.use || l.contract === "plan") return null;
  if (!dv.model && (dv.manualPrice === null || dv.manualPrice === "")) return null;
  const d = devFind(l), pr = devPrice(d, l.contract) || {};
  const online = dv.manualPrice !== null && dv.manualPrice !== "" ? Number(dv.manualPrice) : (pr.ikkatsu ?? null);
  const atama = dv.atama === null || dv.atama === "" ? null : Number(dv.atama);
  const r = { name: dv.model || "（機種未選択）", pay: dv.pay, online, atama, monthly: 0, months: 0, zanka: null, total: null, discount: pr.discount || 0 };
  const credit = Number(dv.shitadori || 0) + Number(dv.point || 0);
  if (online === null) return r;
  if (atama !== null) r.total = online + atama;   // 店頭での端末総額は頭金を入れてから出す
  const fin = online - credit;
  if (dv.pay === "kaedoki" && pr.kaedoki) {
    const k = pr.kaedoki; r.months = k.months; r.zanka = k.zanka; r.program = k.program;
    r.monthly = credit ? Math.max(0, Math.ceil((fin - k.zanka) / k.months)) : k.monthly;
    r.return23 = credit ? null : k.return23; r.return12 = credit ? null : k.return12;
  } else if (dv.pay === "b36" && pr.b36 && !credit) { r.months = 36; r.monthly = pr.b36;
  } else if (dv.pay === "b24" || dv.pay === "b36" || dv.pay === "kaedoki") {
    r.months = dv.pay === "b36" ? 36 : 24; r.monthly = Math.ceil(fin / r.months);
    if (dv.pay === "kaedoki") r.note = "この機種はカエドキの対象外のため24回分割で計算しています";
  } else { r.monthly = 0; }
  return r;
}

// ---------- 画面 ----------
function render() {
  $("tabs").innerHTML = S.lines.map((l, i) => `<button class="tab ${i === S.cur ? "on" : ""}" onclick="S.cur=${i};render()">${l.label || "回線" + (i + 1)}</button>`).join("")
    + `<button class="tab" onclick="addLine()">＋ 回線を追加</button>`;
  const l = S.lines[S.cur], p = plan(l), r = calc(l);
  const tierBtns = p.tiers.map((t, i) => `<div class="tcard ${l.tier === i ? "on" : ""}" onclick="set('tier',${i})"><div class="lb">${t.label === "-" ? "定額" : t.label}</div><div class="yen">${yen(t.price)}</div></div>`).join("");
  const planCard = x => { const lo = Math.min(...x.tiers.map(t => t.price));
    return `<div class="pcard ${l.plan === x.id ? "on" : ""}" onclick="setPlan('${x.id}')"><div class="nm">${x.name}${x.auto ? '<span class="badge">新プラン</span>' : x.changed ? '<span class="badge">料金変更</span>' : ""}</div><div class="pr">月 ${yen(lo)}${x.tiers.length > 1 ? "〜" : ""}</div><div class="tg">${PLAN_TAG[x.id] || ""}</div></div>`; };
  const voices = (VOICE[p.voice] || VOICE.none).map(v => `<div class="chip ${l.voice === v.id ? "on" : ""}" onclick="set('voice','${v.id}')">${v.name}<small>${v.price ? yen(v.price) : ""}</small></div>`).join("");
  const cats = [...new Set(DEV.map(d => d.cat))];
  const models = DEV.filter(d => d.cat === l.device.cat);
  const d = devFind(l), pr = devPrice(d, l.contract) || {};
  const dv = r.dev;
  $("editor").innerHTML = `
  <div class="card"><div class="row">
    <input type="text" value="${esc(l.label)}" oninput="S.lines[S.cur].label=this.value;renderSum()" onchange="render()" style="width:200px" placeholder="例：ご本人／奥様">
    ${CONTRACTS.map(c => `<div class="chip ${l.contract === c.id ? "on" : ""}" onclick="set('contract','${c.id}')">${c.name}</div>`).join("")}
    <span class="sp" style="flex:1"></span>
    ${S.lines.length > 1 ? `<button class="btn danger" onclick="delLine(this)">この回線を削除</button>` : ""}
    <button class="btn" onclick="copyLine()">この回線を複製</button>
  </div></div>

  <div class="card"><h2>① 料金プラン</h2>
    ${planOpen ? `
    <div class="sec-t">スマホのプラン</div>
    <div class="pgrid">${PLANS.filter(x => MAIN_PLANS.includes(x.id)).map(planCard).join("")}</div>
    <div class="sec-t">お子さま・ケータイ・タブレット${PLANS.some(x => x.auto) ? "・新プラン" : ""}</div>
    <div class="pgrid sub">${PLANS.filter(x => !MAIN_PLANS.includes(x.id)).map(planCard).join("")}</div>
    <div style="text-align:right;margin-top:8px"><button class="btn" onclick="planOpen=false;render()">閉じる</button></div>` : `
    <div class="selplan"><div><div class="nm">${p.name}${p.auto ? '<span class="badge">新プラン</span>' : p.changed ? '<span class="badge">料金変更</span>' : ""}</div><div class="tg">${PLAN_TAG[p.id] || ""}</div></div>
      <button class="btn" onclick="planOpen=true;render()">プランを変える</button></div>`}
    ${p.tiers.length > 1 ? `<div class="sec-t">ひと月に使うデータ量（${p.name}）</div><div class="tgrid">${tierBtns}</div>` : `<div class="sec-t">月額（${p.name}）</div><div class="tgrid">${tierBtns}</div>`}
    ${p.note ? `<p class="note">※${p.note}</p>` : ""}
  </div>

  <div class="grid2">
  <div class="card"><h2>② 通話オプション</h2><div class="row">${voices}</div>
    ${p.senior60Kakeho ? `<p class="note">※60歳以上はかけ放題が${yen(SENIOR60_KAKEHO)}（③割引で「60歳以上」を選ぶと反映）</p>` : ""}
    ${l.hearty && HEARTY.plans[p.id] != null && p.voice === "std" ? `<p class="note">※ハーティ割引：5分通話無料は0円、かけ放題は${yen(HEARTY.voice.kakeho)}</p>` : ""}
  </div>

  <div class="card"><h2>③ 割引</h2>
    <div class="row" style="padding:4px 0">ご利用者の年齢：${AGE_GROUPS.map(a => `<div class="chip ${l.age === a.id ? "on" : ""}" onclick="set('age','${a.id}')">${a.name}</div>`).join("")}</div>
    ${(() => { const ag = AGE_DISCOUNTS[l.age]; if (!ag) return l.age === "s60" ? "" : ""; const a = ag.plans[p.id];
      return a ? `<p class="note" style="margin:2px 0 6px">✔ ${ag.name} ▲${yen(a[Math.min(l.tier, a.length - 1)])}（最大${ag.months}か月）　${ag.note}</p>`
               : `<p class="note" style="margin:2px 0 6px">${ag.name}は「${Object.keys(ag.plans).map(id => PLANS.find(x => x.id === id).name).join("・")}」が対象です${l.age === "s60" && p.senior60Kakeho ? "（このプランは60歳以上でかけ放題が" + yen(SENIOR60_KAKEHO) + "）" : ""}</p>`; })()}
    <label class="ck"><input type="checkbox" ${l.hearty ? "checked" : ""} onchange="set('hearty',this.checked)">ハーティ割引（障がい者手帳など）<span class="p">${HEARTY.plans[p.id] != null ? "▲" + yen(HEARTY.plans[p.id]) : "このプランは対象外"}</span></label>
    ${l.hearty && HEARTY.plans[p.id] != null ? `<p class="note" style="margin:2px 0 6px">※ハーティ割引はみんなドコモ割・dカードお支払割と併用できません（自動で外しています）。契約事務手数料は無料。${AGE_DISCOUNTS[l.age] && AGE_DISCOUNTS[l.age].plans[p.id] ? "年齢の割引と同時の場合、実際の割引額が少し変わることがあります。" : ""}</p>` : ""}
    ${p.count ? `<label class="ck"><input type="checkbox" ${l.family ? "checked" : ""} onchange="set('family',this.checked)">ファミリー割引グループに入る（みんなドコモ割の回線数に数える）<span class="p">${p.family ? (familyCount() >= 2 ? "▲" + yen(familyCount() >= 3 ? p.family[1] : p.family[0]) : "（2回線以上で適用）") : "割引なし（回線数には数える）"}</span></label>` : `<p class="note">このプランはみんなドコモ割の回線数に数えません</p>`}
    <div class="row" style="padding:6px 0">見積り以外のご家族のドコモ回線数：<input class="yen" type="number" min="0" value="${S.extra || ""}" placeholder="0" onchange="S.extra=this.value;render()" style="width:70px">回線　<span class="note">現在のカウント：${familyCount()}回線</span></div>
    ${p.dcard ? `<div class="row" style="padding:6px 0">dカードお支払割：
      ${[["none", "なし"], ["gold", "GOLD・PLATINUM ▲" + p.dcard[0]], ["general", "dカード ▲" + p.dcard[1]]].map(([k, n]) => `<div class="chip ${l.dcard === k ? "on" : ""}" onclick="set('dcard','${k}')">${n}</div>`).join("")}</div>` : ""}
    ${p.hikari ? `<label class="ck"><input type="checkbox" ${l.hikari ? "checked" : ""} onchange="set('hikari',this.checked)">ドコモ光／home 5G セット割<span class="p">▲${yen(p.hikari)}</span></label>` : ""}
    ${p.denki ? `<label class="ck"><input type="checkbox" ${l.denki ? "checked" : ""} onchange="set('denki',this.checked)">ドコモでんき セット割<span class="p">▲${yen(p.denki)}</span></label>` : ""}
    ${p.choki ? `<div class="row" style="padding:6px 0">長期利用割：${[["none", "なし"], ["10", "10年以上 ▲110"], ["20", "20年以上 ▲220"]].map(([k, n]) => `<div class="chip ${l.choki === k ? "on" : ""}" onclick="set('choki','${k}')">${n}</div>`).join("")}</div>` : ""}
    ${p.oyako ? `<label class="ck"><input type="checkbox" ${l.oyako ? "checked" : ""} onchange="set('oyako',this.checked)">ドコモ親子割（最大12か月）<span class="p">▲${yen(p.oyako[Math.min(l.tier, 1)])}</span></label>` : ""}
  </div>
  </div>

  <div class="card"><h2>④ オプション <span class="note">（${p.name}で申し込めるものだけ表示）</span></h2>
    ${l.removedMsg ? `<p class="warn">${esc(l.removedMsg)}</p>` : ""}
    ${PLAN_INCLUDES[p.id] ? `<p class="note" style="margin:0 0 6px">ℹ ${p.name}：${PLAN_INCLUDES[p.id]}</p>` : ""}
    ${OPTION_GROUPS.map(g => { const os = OPTIONS.filter(o => o.group === g && optOK(o, p)); return os.length ? `<div style="font-weight:700;color:var(--navy);margin:10px 0 2px">${g}</div>` + os.map(o => optRow(l, o, p)).join("") : ""; }).join("")}
    ${l.freeOpts.map((f, i) => `<div class="row" style="padding:6px 0"><input type="text" placeholder="その他オプション" value="${esc(f.name)}" onchange="S.lines[S.cur].freeOpts[${i}].name=this.value;render()"><input class="yen" type="number" value="${f.price || ""}" placeholder="円" onchange="S.lines[S.cur].freeOpts[${i}].price=this.value;render()"></div>`).join("")}
    <button class="btn" onclick="S.lines[S.cur].freeOpts.push({name:'',price:0});render()">＋ 行を追加</button>
  </div>

  ${l.contract === "plan" ? "" : `
  <div class="card"><h2>⑤ 端末</h2>
    <label class="ck"><input type="checkbox" ${l.device.use ? "checked" : ""} onchange="setDev('use',this.checked)">端末を購入する</label>
    ${l.device.use ? `
    <div class="row" style="margin:6px 0">${cats.length ? cats.map(c => `<div class="chip ${l.device.cat === c ? "on" : ""}" onclick="setDev('cat','${c}');setDev('model','')">${c}</div>`).join("") : `<span class="warn">機種データが未登録です（金額は手入力してください）</span>`}</div>
    ${models.length ? `<select onchange="setDev('model',this.value)" style="width:100%;max-width:520px"><option value="">機種を選択</option>${models.map(m => `<option ${m.name === l.device.model ? "selected" : ""}>${esc(m.name)}</option>`).join("")}</select>` : ""}
    <table class="kv" style="margin-top:8px">
      <tr><td>オンラインショップ価格（${CONTRACTS.find(c => c.id === l.contract).name}）</td><td class="r">${pr.ikkatsu != null ? yen(pr.ikkatsu) + (pr.discount ? `<br><span class="note">本体${yen(pr.hontai)}から割引 ▲${yen(pr.discount)} 適用後</span>` : "") : "—"}</td></tr>
      <tr><td>金額を手入力（オンライン価格がない時）</td><td class="r"><input class="yen" type="number" value="${l.device.manualPrice ?? ""}" onchange="setDev('manualPrice',this.value===''?null:this.value)"></td></tr>
      <tr><td><b>頭金（店頭）</b> <span class="note">入力すると店頭の端末総額が出ます</span></td><td class="r"><input class="yen" type="number" value="${l.device.atama ?? ""}" placeholder="例 3300" onchange="setDev('atama',this.value===''?null:this.value)"></td></tr>
      <tr><td>店頭での端末総額（オンライン価格＋頭金）</td><td class="r">${dv && dv.total !== null ? `<b>${yen(dv.total)}</b>` : `<span class="warn">頭金を入力してください</span>`}</td></tr>
      <tr><td>下取り（円）</td><td class="r"><input class="yen" type="number" value="${l.device.shitadori || ""}" onchange="setDev('shitadori',this.value)"></td></tr>
      <tr><td>ポイント利用（pt）</td><td class="r"><input class="yen" type="number" value="${l.device.point || ""}" onchange="setDev('point',this.value)"></td></tr>
    </table>
    <div class="row" style="margin-top:8px">購入方法：
      ${[["kaedoki", pr.kaedoki ? pr.kaedoki.program : "いつでもカエドキ"], ["b24", "24回分割"], ["b36", "36回分割"], ["ikkatsu", "一括"]].filter(([k]) => k !== "kaedoki" || pr.kaedoki || !d).map(([k, n]) => `<div class="chip ${l.device.pay === k ? "on" : ""}" onclick="setDev('pay','${k}')">${n}</div>`).join("")}
    </div>
    ${dv && dv.online !== null ? `<p>端末の月々：<b>${dv.monthly ? yen(dv.monthly) + " × " + dv.months + "回" : "なし（一括）"}</b>${dv.zanka ? `　24回目（残価）${yen(dv.zanka)}` : ""}${dv.return23 != null ? `<br><span class="note">23か月目に返却した場合の負担額 ${yen(dv.return23)}（プログラム利用料22,000円は別。買替えおトク割で免除あり）</span>` : ""}${dv.note ? `<br><span class="note">${dv.note}</span>` : ""}</p>` : ""}
    ` : ""}
  </div>`}

  <div class="card"><h2>⑥ 初期費用</h2>
    ${l.contract !== "plan" && p.id !== "ahamo" ? `<label class="ck"><input type="checkbox" ${l.init.jimu ? "checked" : ""} onchange="S.lines[S.cur].init.jimu=this.checked;render()">契約事務手数料（翌月請求）<span class="p">4,950円</span></label>` : ""}
    ${INITIAL.filter(i => !i.auto).map(i => `<label class="ck"><input type="checkbox" ${l.init[i.id] ? "checked" : ""} onchange="S.lines[S.cur].init['${i.id}']=this.checked;render()">${i.name}${i.input ? `<span class="p"><input class="yen" type="number" value="${l.initAmt[i.id] || ""}" placeholder="円" onchange="S.lines[S.cur].initAmt['${i.id}']=this.value;S.lines[S.cur].init['${i.id}']=true;render()"></span>` : `<span class="p">${yen(i.price)}</span>`}</label>`).join("")}
    ${l.freeInit.map((f, i) => `<div class="row" style="padding:6px 0"><input type="text" placeholder="その他" value="${esc(f.name)}" onchange="S.lines[S.cur].freeInit[${i}].name=this.value;render()"><input class="yen" type="number" value="${f.price || ""}" placeholder="円" onchange="S.lines[S.cur].freeInit[${i}].price=this.value;render()"></div>`).join("")}
  </div>

  <div class="card"><h2>この回線の合計</h2><table class="kv">
    <tr><td>基本料金（${p.name} ${p.tiers[l.tier].label}）</td><td class="r">${yen(r.base)}</td></tr>
    ${r.disc.map(x => `<tr><td>　${x[0]}</td><td class="r">▲${yen(x[1])}</td></tr>`).join("")}
    <tr><td>通話（${r.voiceName}）</td><td class="r">${yen(r.voice)}</td></tr>
    ${r.opts.map(x => `<tr><td>${esc(x[0])}</td><td class="r">${yen(x[1])}</td></tr>`).join("")}
    <tr><td>端末の月々</td><td class="r">${yen(r.dev ? r.dev.monthly : 0)}</td></tr>
    <tr><td><b>月額合計</b></td><td class="r"><b>${yen(r.monthly)}</b></td></tr>
    ${r.steps.map(x => `<tr><td>　${x.from}か月目からの月額（期間限定の割引が終わった後）</td><td class="r">${yen(x.monthly)}</td></tr>`).join("")}
    <tr><td>初期費用</td><td class="r">${yen(r.initTotal)}</td></tr>
  </table></div>`;
  renderSum();
}
function optRow(l, o, p) {
  const on = !!l.opts[o.id];
  let right;
  if (o.input) right = `<input class="yen" type="number" value="${l.optAmt[o.id] || ""}" placeholder="${o.hint || "円"}" onchange="S.lines[S.cur].optAmt['${o.id}']=this.value;S.lines[S.cur].opts['${o.id}']=true;render()">`;
  else if (o.choices) right = o.choices.map(c => `<span class="chip ${on && Number(l.optAmt[o.id] ?? o.choices[0].p) === c.p ? "on" : ""}" style="padding:4px 8px" onclick="S.lines[S.cur].opts['${o.id}']=true;S.lines[S.cur].optAmt['${o.id}']=${c.p};render();event.preventDefault()">${c.l ? c.l + " " : ""}${yen(c.p)}</span>`).join(" ");
  else right = yen(o.price);
  const sub = [o.need, o.hint2, o.tokuten && p.tokuten ? "選べる特典の対象（2つまで0円）" : "", o.freeWithVoice && p.voice === "std" ? "5分通話無料かかけ放題に入ると割引で0円" : ""].filter(Boolean).join("／");
  return `<label class="ck"><input type="checkbox" ${on ? "checked" : ""} onchange="S.lines[S.cur].opts['${o.id}']=this.checked;render()"><span>${o.name}${sub ? `<br><span class="note">${sub}</span>` : ""}</span><span class="p">${right}</span></label>`;
}
function renderSum() {
  const rs = S.lines.map(calc);
  const m = rs.reduce((a, r) => a + r.monthly, 0), i = rs.reduce((a, r) => a + r.initTotal, 0);
  $("sumbar").innerHTML = `${S.lines.length}回線　月額合計 <b>${yen(m)}</b>　初期費用 <b>${yen(i)}</b>`
    + (S.lines.length > 1 ? `<span class="note">（${S.lines.map((l, k) => esc(l.label) + " " + yen(rs[k].monthly)).join("／")}）</span>` : "");
}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function set(k, v) { S.lines[S.cur][k] = v; render(); }
function setDev(k, v) { S.lines[S.cur].device[k] = v; render(); }
function setPlan(id) { planOpen = false; const l = S.lines[S.cur]; l.plan = id; const p = plan(l);
  const drop = OPTIONS.filter(o => l.opts[o.id] && !optOK(o, p)); drop.forEach(o => delete l.opts[o.id]);
  l.removedMsg = drop.length ? `${p.name}では使えないため外しました：${drop.map(o => o.name).join("、")}` : ""; l.tier = p.tiers.length - 1; l.voice = (VOICE[p.voice] || VOICE.none)[0].id; render(); }
function addLine() { S.lines.push(newLine(S.lines.length + 1)); S.cur = S.lines.length - 1; render(); }
function copyLine() { const c = JSON.parse(JSON.stringify(S.lines[S.cur])); c.label = "回線" + (S.lines.length + 1); S.lines.push(c); S.cur = S.lines.length - 1; render(); }
// 確認ダイアログ（confirm）はiPadのアプリ内ブラウザ等で出ないことがあるため、「2回押し」で確認する
let armed = null, armTimer = null;
function twoTap(btn, key, msg) {
  if (armed === key) { armed = null; clearTimeout(armTimer); return true; }
  armed = key; const orig = btn.textContent; btn.textContent = msg; btn.classList.add("armed");
  clearTimeout(armTimer);
  armTimer = setTimeout(() => { armed = null; btn.textContent = orig; btn.classList.remove("armed"); }, 3000);
  return false;
}
function delLine(btn) { if (S.lines.length < 2) return; if (!twoTap(btn, "del" + S.cur, "もう一度押すと削除")) return; S.lines.splice(S.cur, 1); S.cur = Math.min(S.cur, S.lines.length - 1); render(); }
function resetAll(btn) { if (!twoTap(btn, "reset", "もう一度押すと全部消去")) return; S = { lines: [newLine(1)], cur: 0, extra: 0 }; $("customer").value = ""; render(); }


// ---------- 印刷 ----------
function doPrint() {
  const rs = S.lines.map(calc);
  const today = new Date(), ds = `${today.getFullYear()}年${today.getMonth() + 1}月${today.getDate()}日`;
  const head = `<div class="ph"><h1>簡易見積書</h1><div class="meta">${ds}<br>${esc($("store").value)}${$("staff").value ? "　担当：" + esc($("staff").value) : ""}${$("customer").value ? `<br><b>${esc($("customer").value)} 様</b>` : ""}</div></div>`;
  const blocks = S.lines.map((l, k) => {
    const r = rs[k], p = plan(l);
    const left = `<table class="pt"><tr><th colspan="2">月額料金</th></tr>
      <tr><td>${p.name}（${p.tiers[l.tier].label}）</td><td class="r">${yen(r.base)}</td></tr>
      ${r.disc.map(x => `<tr><td>　${x[0]}</td><td class="r">▲${yen(x[1])}</td></tr>`).join("")}
      <tr><td>通話：${r.voiceName}</td><td class="r">${yen(r.voice)}</td></tr>
      ${r.opts.map(x => `<tr><td>${esc(x[0])}</td><td class="r">${yen(x[1])}</td></tr>`).join("")}
      <tr><td><b>基本料金 小計</b></td><td class="r"><b>${yen(r.monthlyCharge)}</b></td></tr></table>`;
    const dv = r.dev;
    const right = `${dv ? `<table class="pt"><tr><th colspan="2">端末について</th></tr>
      <tr><td>機種</td><td class="r" style="width:auto">${esc(dv.name)}</td></tr>
      <tr><td>購入方法</td><td class="r" style="width:auto">${dv.pay === "kaedoki" && dv.program ? dv.program : { kaedoki: "24回分割", b24: "24回分割", b36: "36回分割", ikkatsu: "一括" }[dv.pay]}</td></tr>
      <tr><td>端末代金（店頭）</td><td class="r">${dv.total !== null ? yen(dv.total) : "—"}</td></tr>
      ${dv.atama !== null ? `<tr><td>うち頭金</td><td class="r">${yen(dv.atama)}</td></tr>` : ""}
      ${Number(l.device.shitadori) ? `<tr><td>下取り</td><td class="r">▲${yen(l.device.shitadori)}</td></tr>` : ""}
      ${Number(l.device.point) ? `<tr><td>ポイント利用</td><td class="r">▲${Number(l.device.point).toLocaleString()}pt</td></tr>` : ""}
      <tr><td>端末の月々</td><td class="r">${dv.monthly ? yen(dv.monthly) + "×" + dv.months + "回" : "—"}</td></tr>
      ${dv.zanka ? `<tr><td>24回目（残価）</td><td class="r">${yen(dv.zanka)}</td></tr>` : ""}
      ${dv.return23 != null ? `<tr><td>23か月目返却時の負担額</td><td class="r">${yen(dv.return23)}</td></tr>` : ""}</table>` : ""}
      <table class="pt"><tr><th colspan="2">初期費用</th></tr>
      ${r.init.length ? r.init.map(x => `<tr><td>${esc(x[0])}</td><td class="r">${yen(x[1])}</td></tr>`).join("") : `<tr><td>なし</td><td class="r">0円</td></tr>`}
      <tr><td><b>初期費用 合計</b></td><td class="r"><b>${yen(r.initTotal)}</b></td></tr></table>`;
    return `<div class="line-block">${S.lines.length > 1 ? `<div class="lh">${esc(l.label)}（${CONTRACTS.find(c => c.id === l.contract).name}）</div>` : `<div class="lh">${CONTRACTS.find(c => c.id === l.contract).name}</div>`}
      <div class="cols"><div>${left}</div><div>${right}</div></div>
      <div class="tot">月額合計（基本料金＋端末の月々）　<span class="big">約 ${yen(r.monthly)}</span>／月${r.steps.map(x => `<br>　${x.from}か月目からは 約 <b>${yen(x.monthly)}</b>／月（期間限定の割引の終了後）`).join("")}</div></div>`;
  });
  const m = rs.reduce((a, r) => a + r.monthly, 0), it = rs.reduce((a, r) => a + r.initTotal, 0);
  const fam = S.lines.length > 1 ? `<div class="tot" style="margin-bottom:4mm"><b>ご家族 ${S.lines.length}回線の合計</b>　月額 <span class="big">約 ${yen(m)}</span>／月　初期費用 ${yen(it)}
    <div class="pn">${S.lines.map((l, k) => esc(l.label) + "：" + yen(rs[k].monthly)).join("　")}</div></div>` : "";
  const notes = `<div class="pn">※金額はすべて税込です。${DATA_AS_OF}。端末代金はドコモオンラインショップ価格に店頭の頭金を加えた金額です。<br>※割引・キャンペーンには適用条件があります。実際のご請求額と異なる場合があります。</div>`;
  $("print").innerHTML = `<div class="pg">${head}${fam}${blocks.join("")}${notes}</div>`;
  setTimeout(() => window.print(), 50);
}

$("store").innerHTML = STORES.map(s => `<option>${s}</option>`).join("");
try { const sv = localStorage.getItem("mitsumori_store"); if (sv) $("store").value = sv; } catch (e) {}
$("store").onchange = () => { try { localStorage.setItem("mitsumori_store", $("store").value); } catch (e) {} };
$("asof").textContent = "料金データ：" + DATA_AS_OF + (typeof DEVICES_AS_OF !== "undefined" ? "／機種代金：" + DEVICES_AS_OF : "");
renderNews();
render();
</script>
</body>
</html>
