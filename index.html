<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="簡易見積書">
<meta name="format-detection" content="telephone=no">
<title>簡易見積書</title>
<style>
:root { --navy:#1b3f73; --line:#c9d3e3; --bg:#f4f6fa; --red:#c62828; }
* { box-sizing: border-box; }
body { margin:0; font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif; color:#222; background:var(--bg); font-size:15px; }
header.bar { background:var(--navy); color:#fff; padding:10px 16px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; position:sticky; top:0; z-index:5; }
header.bar h1 { font-size:18px; margin:0 12px 0 0; }
header.bar select, header.bar input { font-size:15px; padding:6px 8px; border-radius:6px; border:none; }
header.bar .sp { flex:1; }
header.bar #store { max-width:250px; } header.bar #customer { width:150px !important; } header.bar #staff { width:100px !important; }
.card { scroll-margin-top:70px; }
.btn { border:1px solid var(--navy); background:#fff; color:var(--navy); border-radius:8px; padding:8px 12px; font-size:15px; cursor:pointer; font-weight:700; }
.btn.main { background:#fff; color:var(--navy); border-color:#fff; }
.btn.danger { color:var(--red); border-color:var(--red); }
.btn.armed { background:var(--red) !important; color:#fff !important; border-color:var(--red) !important; }
main { padding:12px 16px 120px; max-width:1100px; margin:0 auto; }
.tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
.tab { padding:8px 14px; border-radius:8px 8px 0 0; background:#dde4f0; cursor:pointer; font-weight:700; border:none; font-size:15px; }
.tab.on { background:#fff; color:var(--navy); box-shadow:0 -2px 0 var(--navy) inset; }
.card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:12px; }
.card h2 { font-size:16px; margin:0 0 8px; color:var(--navy); }
.row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.chip { border:1.5px solid var(--line); background:#fff; border-radius:8px; padding:8px 12px; cursor:pointer; font-size:14px; line-height:1.3; text-align:center; }
.chip small { display:block; color:#555; font-size:12px; }
.chip.on { border-color:var(--navy); background:var(--navy); color:#fff; }
.chip.on small { color:#dde4f0; }
.grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:12px; }
label.ck { display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px dashed #e3e7ee; }
label.ck span.p { margin-left:auto; font-weight:700; white-space:nowrap; }
input[type=number], input[type=text], select { font-size:15px; padding:6px 8px; border:1px solid #b9c4d6; border-radius:6px; }
input.yen { width:110px; text-align:right; }
.note { font-size:12px; color:#666; }
.warn { color:var(--red); font-weight:700; }
.sum { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:2px solid var(--navy); padding:8px 16px; display:flex; gap:18px; align-items:center; flex-wrap:wrap; z-index:5; }
.sum b { font-size:20px; color:var(--navy); }
table.kv { width:100%; border-collapse:collapse; font-size:14px; }
table.kv td { padding:4px 6px; border-bottom:1px solid #eef1f6; }
table.kv td.r { text-align:right; white-space:nowrap; }
/* #print は #pv（プレビュー）の中に表示 */
.wtag { font-size:11px; border-radius:4px; padding:1px 6px; margin-left:4px; } .wtag.today { background:#fde8e8; color:var(--red); } .wtag.next { background:#e8eef8; color:var(--navy); }
.cardb { margin-top:6px; padding:6px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; color:#222; font-size:13px; } .cardb.on { border:2px solid var(--navy); background:#eef2f9; } .cardb small { display:block; color:#666; font-size:11px; }
.og { font-weight:700; color:var(--navy); margin:12px 0 2px; }
details.others { margin-top:12px; border:1.5px solid var(--line); border-radius:10px; padding:4px 12px 8px; background:#fafbfd; }
details.others > summary { cursor:pointer; font-weight:700; color:var(--navy); padding:8px 0; min-height:30px; list-style:none; }
details.others > summary::before { content:"＋ "; } details.others[open] > summary::before { content:"－ "; }
/* 割引の欄 */
.drow { display:grid; grid-template-columns:150px 1fr 110px; gap:10px; align-items:center; padding:10px 0; border-bottom:1px solid #eef1f6; }
.drow .dt { font-weight:700; font-size:14px; }
.drow .ds { font-size:12px; color:#666; margin-top:4px; line-height:1.4; }
.drow .da { text-align:right; } .drow .da small { display:block; font-size:11px; color:#666; }
.dv { font-size:16px; color:var(--red); } .dv.off { color:#aaa; font-weight:400; font-size:14px; }
.seg { display:inline-flex; flex-wrap:wrap; border:1.5px solid var(--line); border-radius:10px; overflow:hidden; background:#fff; vertical-align:middle; }
.seg button { border:none; border-right:1px solid var(--line); background:#fff; padding:8px 14px; font-size:15px; min-height:42px; cursor:pointer; touch-action:manipulation; color:#222; }
.seg button:last-child { border-right:none; }
.seg button.on { background:var(--navy); color:#fff; font-weight:700; }
.seg button:disabled { color:#bbb; background:#f6f6f6; cursor:not-allowed; } .seg button.on:disabled { background:#9aa7bd; color:#fff; }
.step { display:inline-flex; align-items:center; gap:6px; margin-left:10px; font-size:13px; color:#444; vertical-align:middle; }
.step button { width:40px; height:40px; border:1.5px solid var(--line); border-radius:8px; background:#fff; font-size:18px; cursor:pointer; touch-action:manipulation; }
.step b { min-width:20px; text-align:center; font-size:16px; }
.dtot { text-align:right; padding:10px 0 2px; font-size:14px; } .dtot b { font-size:18px; color:var(--red); } .dtot small { display:block; color:#666; }
@media (max-width:700px) { .drow { grid-template-columns:1fr auto; } .drow .dc { grid-column:1 / -1; grid-row:2; } }
/* 料金プラン選び */
.sec-t { font-size:13px; font-weight:700; color:#555; margin:10px 0 6px; }
.pgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:8px; }
.pgrid.sub { grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); }
.pcard { border:1.5px solid var(--line); background:#fff; border-radius:10px; padding:10px 12px; cursor:pointer; text-align:left; line-height:1.35; min-height:44px; touch-action:manipulation; }
.pcard .nm { font-weight:700; font-size:15px; }
.pcard .pr { font-size:13px; color:var(--navy); font-weight:700; margin-top:2px; }
.pcard .tg { font-size:12px; color:#666; margin-top:2px; }
.pgrid.sub .pcard { padding:8px 10px; } .pgrid.sub .pcard .nm { font-size:14px; }
.pcard.on { background:var(--navy); border-color:var(--navy); color:#fff; }
.pcard.on .pr, .pcard.on .tg { color:#dde4f0; }
.selplan { display:flex; align-items:center; justify-content:space-between; gap:10px; background:#eef2f9; border:1.5px solid var(--navy); border-radius:10px; padding:10px 12px; }
.selplan .nm { font-size:18px; font-weight:800; color:var(--navy); } .selplan .tg { font-size:13px; color:#555; }
.tgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; }
.tcard { border:1.5px solid var(--line); background:#fff; border-radius:10px; padding:10px; cursor:pointer; text-align:center; min-height:44px; touch-action:manipulation; }
.tcard .lb { font-size:14px; } .tcard .yen { font-size:20px; font-weight:800; color:var(--navy); margin-top:2px; }
.tcard.on { background:var(--navy); border-color:var(--navy); color:#fff; } .tcard.on .yen { color:#fff; }
.news { background:#fff; border:1px solid var(--line); border-left:5px solid var(--navy); border-radius:8px; padding:8px 12px; margin-bottom:10px; font-size:14px; }
.news.bad { border-left-color:var(--red); }
.news summary { cursor:pointer; font-weight:700; color:var(--navy); }
.news ul { margin:6px 0 0; padding-left:20px; } .news li { margin:3px 0; }
.badge { display:inline-block; background:var(--red); color:#fff; font-size:11px; border-radius:4px; padding:1px 5px; margin-left:4px; vertical-align:middle; }
/* iPad（タッチ操作）向け */
html { -webkit-text-size-adjust:100%; }
* { -webkit-tap-highlight-color:transparent; }
.chip, .btn, .tab { min-height:44px; touch-action:manipulation; }
input[type=number], input[type=text], select, header.bar select, header.bar input { font-size:16px; min-height:40px; }
input[type=checkbox] { width:22px; height:22px; }
label.ck { min-height:44px; }
.sum { padding-bottom:calc(8px + env(safe-area-inset-bottom)); }

/* ===== 印刷（A4縦） ===== */
@page { size:A4 portrait; margin:10mm 10mm 10mm; }
/* 見積書の中身（プレビュー・印刷で共通）。罫線の表をやめ、大きな数字＋行リストで見せる */
#print { color:#000; font-size:10.5pt; line-height:1.4; }
#print * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
#print .pg { break-after:page; page-break-after:always; width:190mm; }
#print .pg:last-child { break-after:auto; page-break-after:auto; }
#print .ph { display:flex; justify-content:space-between; align-items:flex-end; gap:6mm; padding-bottom:2.5mm; border-bottom:0.9mm solid #000; margin-bottom:5mm; }
#print .ph .ttl { font-size:10pt; letter-spacing:.3em; font-weight:700; color:#333; }
#print .ph .who { font-size:17pt; font-weight:800; line-height:1.25; margin-top:0.5mm; }
#print .ph .who small { font-size:11pt; font-weight:700; margin-left:3mm; }
#print .ph .meta { font-size:9pt; text-align:right; line-height:1.5; white-space:nowrap; }
/* いちばん上：毎月・当日・翌月 */
#print .hero { display:grid; grid-template-columns:1.65fr 1fr; gap:4mm; margin-bottom:4mm; }
#print .hero.solo { grid-template-columns:1fr; }
#print .totl { font-size:12pt; font-weight:800; letter-spacing:.3em; border-top:0.9mm solid #000; padding-top:2.5mm; margin:2mm 0 2.5mm; }
#print .psteps { margin-top:-1mm; }
#print .hm { border:1mm solid #000; border-radius:3mm; padding:3mm 5mm 3.5mm; }
#print .hm .lb { font-size:11.5pt; font-weight:800; }
#print .hm .big { font-size:34pt; font-weight:800; line-height:1.15; letter-spacing:.01em; }
#print .hm .big small { font-size:15pt; font-weight:800; margin-left:1mm; }
#print .hm .big em { font-style:normal; font-size:15pt; margin-right:2mm; }
#print .fm { display:flex; align-items:stretch; gap:1.5mm; margin-top:2mm; }
#print .fm > div { flex:1; background:#ebebeb; border-radius:2mm; padding:1.5mm 2.5mm; }
#print .fm span { display:block; font-size:8.5pt; font-weight:700; }
#print .fm b { font-size:12.5pt; }
#print .fm i { font-style:normal; font-weight:800; font-size:13pt; align-self:center; }
#print .hs { display:grid; gap:3mm; }
#print .hs > div { border:0.5mm solid #000; border-radius:3mm; padding:2.5mm 4.5mm; display:flex; flex-direction:column; justify-content:center; }
#print .hs > div.td { background:#000; color:#fff; }
#print .hs span { font-size:10.5pt; font-weight:800; }
#print .hs b { font-size:26pt; font-weight:800; line-height:1.25; }
#print .hs small { font-size:8pt; }
#print .psteps { background:#ebebeb; border-radius:2mm; padding:2mm 4mm; margin-bottom:4mm; font-size:10.5pt; }
#print .psteps b { font-size:12.5pt; }
/* 内訳：行リスト */
#print .cols { display:grid; grid-template-columns:1fr 1fr; gap:7mm; align-items:start; }
#print .sec { margin-bottom:5mm; }
#print .sec h3 { font-size:12pt; margin:0 0 1mm; padding:1.3mm 3mm; background:#e4e4e4; border-left:2.2mm solid #000; display:flex; justify-content:space-between; }
#print .sec h3 small { font-size:9pt; font-weight:400; align-self:center; }
#print .sec h4 { font-size:10pt; margin:3mm 0 0.5mm 1mm; }
#print .rw { display:flex; justify-content:space-between; align-items:baseline; gap:3mm; padding:1.5mm 1mm; border-bottom:0.2mm solid #c8c8c8; }
#print .rw span { flex:1; }
#print .rw b { font-weight:600; white-space:nowrap; }
#print .rw.dc span { padding-left:4mm; }
#print .rw.dc span::before { content:"割引"; font-size:7.5pt; font-weight:700; border:0.25mm solid #000; border-radius:1mm; padding:0 1mm; margin-right:1.5mm; }
#print .rw.st { border-bottom:none; border-top:0.5mm solid #000; margin-top:-0.2mm; font-weight:800; font-size:11.5pt; }
#print .rw.st b { font-weight:800; }
#print .rw.sub { font-size:9pt; color:#333; border-bottom:none; padding-top:0.5mm; }
#print .cardsec .cd { border:0.3mm solid #999; border-radius:2mm; padding:1mm 2.5mm 0.5mm; margin-top:1.5mm; } #print .cardsec .cd.sel { border:0.6mm solid #000; }
#print .cardsec .cn { font-weight:800; font-size:11pt; padding-top:0.5mm; } #print .cardsec .cn em { font-style:normal; font-size:8pt; font-weight:700; border:0.25mm solid #000; border-radius:1mm; padding:0 1.2mm; margin-left:2mm; }
#print .cardsec .rw { font-size:9.5pt; padding:1mm 0.5mm; } #print .cardsec .rw.st { font-size:10.5pt; }
#print .psteps + .psteps { margin-top:-2mm; }
#print .dn { font-size:13.5pt; font-weight:800; padding:1.5mm 1mm 1mm; }
#print .none { padding:2mm 1mm; color:#444; }
#print .pn { font-size:8pt; color:#333; margin-top:3mm; line-height:1.5; }
/* 家族のまとめ表 */
#print table.fam { width:100%; border-collapse:collapse; margin-top:2mm; }
#print table.fam th { text-align:left; font-size:9.5pt; padding:2mm 2mm; border-bottom:0.6mm solid #000; white-space:nowrap; }
#print table.fam td { padding:3mm 2mm; border-bottom:0.2mm solid #c8c8c8; font-size:10.5pt; }
#print table.fam .r { text-align:right; white-space:nowrap; }
#print table.fam td.nm { font-weight:800; font-size:12pt; white-space:nowrap; }
#print table.fam td small { display:block; font-size:8.5pt; color:#333; }
#print table.fam tr.tsum td { border-top:0.6mm solid #000; border-bottom:none; font-weight:800; font-size:12pt; }
/* まとめて1枚：1回線ずつのカード */
#print .card1 { border:0.5mm solid #000; border-radius:3mm; margin-bottom:4mm; overflow:hidden; break-inside:avoid; }
#print .card1 .ch { display:flex; justify-content:space-between; align-items:baseline; background:#000; color:#fff; padding:1.5mm 4mm; font-weight:800; font-size:12pt; }
#print .card1 .ch b { font-size:14pt; }
#print .card1 .cb { display:grid; grid-template-columns:1.2fr 1fr 1fr; gap:5mm; padding:2.5mm 4mm 3mm; }
#print .card1 h5 { font-size:9.5pt; margin:0 0 0.5mm; padding-bottom:0.8mm; border-bottom:0.4mm solid #000; }
#print .card1 .rw { font-size:9pt; padding:0.9mm 0; }
#print .card1 .rw.st { font-size:10pt; }
#print .card1 .dn { font-size:10pt; padding:1mm 0 0; }
/* 画面の印刷プレビュー */
#pv { display:none; position:fixed; inset:0; z-index:50; background:#5f6670; overflow:auto; -webkit-overflow-scrolling:touch; }
#pv.open { display:block; }
.pvbar { position:sticky; top:0; z-index:2; display:flex; flex-wrap:wrap; gap:10px; align-items:center; background:var(--navy); color:#fff; padding:10px 16px; }
.pvbar b { font-size:17px; margin-right:auto; }
.pvbar .btn { background:#fff; }
.pvbar .seg button { min-height:38px; font-size:14px; }
@media screen { #print .pg { background:#fff; margin:0 auto 16px; } #pv .sheet { width:max-content; max-width:none; min-height:0; margin:16px auto 40px; background:none; box-shadow:none; padding:0; } #print .pg { padding:10mm; min-height:262mm; box-shadow:0 4px 18px rgba(0,0,0,.35); box-sizing:content-box; } }
.pvbar .hint { width:100%; font-size:12px; color:#dde4f0; }
.sheet { width:210mm; min-height:297mm; margin:16px auto 40px; background:#fff; padding:10mm; box-shadow:0 4px 18px rgba(0,0,0,.35); box-sizing:border-box; }
body.pvopen { overflow:hidden; }
@media print {
  body { background:#fff; }
  header.bar, main, .sum, .pvbar { display:none !important; }
  #pv { display:block !important; position:static; background:none; overflow:visible; }
  .sheet { width:auto; max-width:none; min-height:0; margin:0; padding:0; box-shadow:none; }
}
</style>
<script>
// 毎日更新されるデータを、iPadに古いまま残さず必ず最新で読み込む
(function () { const v = Date.now(); ["data.js", "devices.js", "hosho.js", "updates.js"].forEach(f => document.write('<script src="' + f + '?v=' + v + '"><\/script>')); })();
</script>
</head>
<body>
<header class="bar">
  <h1>簡易見積書</h1>
  <select id="store"></select>
  <input id="staff" type="text" placeholder="担当者" style="width:110px">
  <span class="sp"></span>
  <button class="btn" onclick="resetAll(this)">クリア</button>
  <button class="btn main" onclick="doPrint()">🖨 印刷プレビュー</button>
</header>

<main>
  <div id="news"></div>
  <div class="tabs" id="tabs"></div>
  <div id="editor"></div>
  <p class="note" id="asof"></p>
</main>

<div class="sum" id="sumbar"></div>
<div id="pv">
  <div class="pvbar"><b>印刷プレビュー <span id="pvcount" style="font-size:13px;font-weight:400"></span></b>
    <span class="seg" id="pvmode"></span>
    <button class="btn" onclick="window.print()">🖨 印刷する</button>
    <button class="btn" onclick="closePv()">✕ 閉じる（見積に戻る）</button>
    <span class="hint">「印刷する」で印刷画面が開かない時は、iPadのSafariなら画面上の共有ボタン（□↑）→「プリント」で印刷できます。</span></div>
  <div class="sheet"><div id="print"></div></div>
</div>

<script>
const yen = n => (Math.round(n)||0).toLocaleString("ja-JP") + "円";
const $ = id => document.getElementById(id);
const DEV = (typeof DEVICES !== "undefined") ? DEVICES : [];
// 毎朝の自動チェックで見つかった新プラン・料金変更を反映
if (typeof AUTO_PLANS !== "undefined") AUTO_PLANS.forEach(ap => { if (!PLANS.find(x => x.id === ap.id)) PLANS.push(ap); });
if (typeof PLAN_OVERRIDES !== "undefined") Object.entries(PLAN_OVERRIDES).forEach(([id, t]) => { const p = PLANS.find(x => x.id === id); if (!p) return;
  Object.entries(t).forEach(([i, v]) => { if (p.tiers[i] && p.tiers[i].price !== v) { p.tiers[i].price = v; p.changed = true; } }); });
function renderNews() {
  if (typeof UPDATES === "undefined" || !UPDATES) { $("news").innerHTML = ""; return; }
  const U = UPDATES, age = (Date.now() - new Date(U.checked_at.replace(" ", "T") + ":00+09:00")) / 86400000;
  const stale = age > 2;
  const items = (U.news || []).map(n => `<li>${esc(n.date.slice(5).replace("-", "/"))}　${esc(n.text)}</li>`).join("");
  $("news").innerHTML = `<div class="news ${!U.ok || stale ? "bad" : ""}">
    ${!U.ok ? `<div class="warn">⚠ ${esc(U.message)}</div>` : ""}
    ${stale ? `<div class="warn">⚠ 自動更新が${Math.floor(age)}日止まっています（最終チェック ${esc(U.checked_at)}）。担当者に連絡してください。</div>` : ""}
    ${items ? `<details><summary>📢 ドコモの更新情報（${(U.news || []).length}件・直近2週間）</summary><ul>${items}</ul></details>` : `<span class="note">📢 ドコモの料金・機種は毎朝自動でチェックしています（最終チェック ${esc(U.checked_at)}）。直近2週間の変更はありません。</span>`}
  </div>`;
}

function newLine(n) {
  return { label: "回線" + n, contract: "mnp", plan: "max", tier: 2, voice: "none", age: "none", hearty: false, kosodate: false, curCat: "", curModel: "",
    family: true, dcard: "none", hikari: false, denki: false, choki: "none", oyako: false,
    opts: {}, optAmt: {}, freeOpts: [{ name: "", price: 0 }],
    device: { use: true, cat: "", model: "", pay: "kaedoki", manualPrice: null, atama: null, shitadori: 0, point: 0 },
    init: { jimu: true }, initAmt: {}, initWhen: {}, freeInit: [{ name: "", price: 0 }] };
}
let S = { lines: [newLine(1)], cur: 0, extra: 0 };

function plan(l) { const p = PLANS.find(x => x.id === l.plan); if (l.tier >= p.tiers.length) l.tier = p.tiers.length - 1; const vs = VOICE[p.voice] || VOICE.none; if (!vs.find(v => v.id === l.voice)) l.voice = vs[0].id; return p; }
function familyCount() { return S.lines.filter(l => { const p = plan(l); return p && p.count && l.family; }).length + Number(S.extra || 0); }

// ---------- 計算 ----------
function calc(l) {
  const p = plan(l), t = p.tiers[Math.min(l.tier, p.tiers.length - 1)];
  const r = { base: t.price, disc: [], voice: 0, opts: [], promos: [], dev: null };
  const fc = familyCount();
  const hearty = l.hearty && HEARTY.plans[p.id] != null;

  if (o.tokuten && p.tokuten && !e.why) tips.push("選べる特典の対象（2つまで0円）");
  if (o.promo && o.promo[p.id]) tips.push(`${p.name}は最大${o.promo[p.id]}か月 ${yen(o.promoAmt)}引き${o.promoNote ? "（" + o.promoNote + "）" : ""}`);
  else if (o.hint2) tips.push(o.hint2);

  if (o.id === "optpack" && l.opts.optpack && (l.opts.rusuden || l.opts.catch)) tips.push("⚠ 留守電・キャッチとパックが重複しています");
  if (o._warn) tips.unshift('<span class="warn">金額を入力してください（機種によって変わります）</span>');
  const sub = tips.join("／");
  return `<label class="ck"><input type="checkbox" ${on ? "checked" : ""} onchange="S.lines[S.cur].opts['${o.id}']=this.checked;render()"><span>${o.name}${sub ? `<br><span class="note">${sub}</span>` : ""}</span><span class="p">${right}</span></label>`;
}
function renderSum() {
  const rs = S.lines.map(calc);
  const m = rs.reduce((a, r) => a + r.monthly, 0), i = rs.reduce((a, r) => a + r.initTotal, 0);
  const td = rs.reduce((a, r) => a + r.today, 0);
  $("sumbar").innerHTML = `${S.lines.length}回線　月額合計 <b>${yen(m)}</b>${td ? `　当日のお支払い <b>${yen(td)}</b>` : ""}　<span class="note">初期費用 計${yen(i)}</span>`
    + (S.lines.length > 1 ? `<span class="note">（${S.lines.map((l, k) => esc(l.label) + " " + yen(rs[k].monthly)).join("／")}）</span>` : "");
}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function set(k, v) { S.lines[S.cur][k] = v; render(); }
function setDev(k, v) { S.lines[S.cur].device[k] = v; render(); }
function setPlan(id) { planOpen = false; const l = S.lines[S.cur]; l.plan = id; const p = plan(l);
  const drop = OPTIONS.filter(o => l.opts[o.id] && !optOK(o, p, l)); drop.forEach(o => delete l.opts[o.id]);
  l.removedMsg = drop.length ? `${p.name}では使えないため外しました：${drop.map(o => o.name).join("、")}` : ""; l.tier = p.tiers.length - 1; l.voice = (VOICE[p.voice] || VOICE.none)[0].id; render(); }
function addLine() { S.lines.push(newLine(S.lines.length + 1)); S.cur = S.lines.length - 1; render(); }
function copyLine() { const c = JSON.parse(JSON.stringify(S.lines[S.cur])); c.label = "回線" + (S.lines.length + 1); S.lines.push(c); S.cur = S.lines.length - 1; render(); }
// 確認ダイアログ（confirm）はiPadのアプリ内ブラウザ等で出ないことがあるため、「2回押し」で確認する
let armed = null, armTimer = null;
function twoTap(btn, key, msg) {
  if (armed === key) { armed = null; clearTimeout(armTimer); return true; }
  armed = key; const orig = btn.textContent; btn.textContent = msg; btn.classList.add("armed");
  clearTimeout(armTimer);
  armTimer = setTimeout(() => { armed = null; btn.textContent = orig; btn.classList.remove("armed"); }, 3000);
  return false;
}
function delLine(btn) { if (S.lines.length < 2) return; if (!twoTap(btn, "del" + S.cur, "もう一度押すと削除")) return; S.lines.splice(S.cur, 1); S.cur = Math.min(S.cur, S.lines.length - 1); render(); }
function resetAll(btn) { if (!twoTap(btn, "reset", "もう一度押すと全部消去")) return; S = { lines: [newLine(1)], cur: 0, extra: 0 }; render(); }


// ---------- 印刷 ----------
function closePv() { $("pv").classList.remove("open"); document.body.classList.remove("pvopen"); }
let printMode = "each";   // each＝1回線ずつ1枚（家族はまとめ付き）／one＝全回線を1枚に
function doPrint(mode) {
  if (mode) printMode = mode;
  const rs = S.lines.map(calc), N = S.lines.length;
  const today = new Date(), ds = `${today.getFullYear()}年${today.getMonth() + 1}月${today.getDate()}日`;
  const staff = $("staff").value, store = $("store").value;
  const nm = k => (k + 1) + "回線目";   // 見積書にはお客様名・続柄などの個人情報は載せない
  const head = (who, sub) => `<div class="ph"><div><div class="ttl">簡易見積書</div><div class="who">${who}${sub ? `<small>${sub}</small>` : ""}</div></div>
    <div class="meta">${ds}<br>${esc(store)}${staff ? "<br>担当：" + esc(staff) : ""}</div></div>`;
  const rw = (a, b, cls) => `<div class="rw ${cls || ""}"><span>${a}</span><b>${b}</b></div>`;
  const optRows = r => r.opts.length ? r.opts.map(x => x[1] < 0 ? rw(esc(x[0]), "▲" + yen(-x[1]), "dc") : rw(esc(x[0]), yen(x[1]))).join("") : `<div class="none">なし</div>`;
  const payName = dv => dv.pay === "kaedoki" && dv.program ? dv.program : { kaedoki: "24回分割", b12: "12回分割", b24: "24回分割", b36: "36回分割", ikkatsu: "一括払い" }[dv.pay];
  const notes = `<div class="pn">※金額はすべて税込です（${DATA_AS_OF}）。端末代金はドコモオンラインショップ価格に店頭の頭金を加えた金額です。毎月のお支払いは目安で、1か月目は日割りなどで変わる場合があります。<br>※割引・キャンペーンには適用条件があります。実際のご請求額と異なる場合があります。</div>`;
  const hero = (label, monthly, todayAmt, nextAmt, formula) => `<div class="hero ${todayAmt ? "" : "solo"}">
    <div class="hm"><div class="lb">${label}</div><div class="big"><em>約</em>${(Math.round(monthly) || 0).toLocaleString("ja-JP")}<small>円／月</small></div>${formula || ""}</div>
    ${todayAmt ? `<div class="hs"><div class="td"><span>当日のお支払い</span><b>${yen(todayAmt)}</b><small>頭金・アクセサリーなど、今日お店でお支払いいただく金額</small></div></div>` : ""}</div>`;
  const stepsBox = r => r.steps.length ? `<div class="psteps">${r.steps.map(x => `▶ <b>${x.from}か月目から</b>は 約 <b>${yen(x.monthly)}</b>／月`).join("　")}<span style="font-size:9pt">（期間限定の割引が終わるため）</span></div>` : "";

  // 内訳の部品（1回線ずつのページ・まとめて1枚の両方で使う）
  const planRows = (l, r, p) => rw(p.name + "（" + p.tiers[l.tier].label + "）", yen(r.base))
    + r.disc.map(x => rw(x[0], "▲" + yen(x[1]), "dc")).join("")
    + r.late.map(x => rw(x[0] + "（" + (x[2] + 1) + "か月目から）", "▲" + yen(x[1]), "dc")).join("")
    + rw("通話：" + r.voiceName, yen(r.voice));
  const initRows = (r, when) => { const xs = r.init.filter(x => x[2] === when); return xs.length ? xs.map(x => rw(esc(x[0]), yen(x[1]))).join("") : `<div class="none">なし</div>`; };

  // --- 1回線ぶんのページ ---
  const linePage = (l, k) => {
    const r = rs[k], p = plan(l), dv = r.dev, c = CONTRACTS.find(x => x.id === l.contract).name;
    const planSum = r.planNet + r.voice, optSum = r.opts.reduce((a, b) => a + b[1], 0), devM = dv ? dv.monthly : 0;
    const formula = `<div class="fm"><div><span>① 料金プラン</span><b>${yen(planSum)}</b></div><i>＋</i><div><span>② オプション</span><b>${yen(optSum)}</b></div>${devM ? `<i>＋</i><div><span>③ 端末の分割</span><b>${yen(devM)}</b></div>` : ""}</div>`;
    const sec1 = `<div class="sec"><h3>① 料金プラン</h3>${planRows(l, r, p)}${rw("① 小計", yen(planSum), "st")}</div>`;
    const sec2 = `<div class="sec"><h3>② オプション</h3>${optRows(r)}${rw("② 小計", yen(optSum), "st")}</div>`;
    const cardSec = r.cards.length ? `<div class="sec cardsec"><h3>dカードでおトクになる分 <small>毎月の目安</small></h3>
      ${r.cards.map(c => `<div class="cd ${c.sel ? "sel" : ""}"><div class="cn">${c.name}${c.sel ? "<em>ご利用予定</em>" : "<em>お持ちの場合</em>"}</div>
        ${rw("料金の割引（dカードお支払割）", yen(c.off))}${rw("料金でたまるdポイント（" + Math.round(DCARD[c.id].rate * 100) + "%）", c.pts.toLocaleString() + "pt")}
        ${rw("あわせて 毎月", "約 " + yen(c.total) + " 相当", "st")}${rw("年間では 約 " + yen(c.total * 12) + " 相当", "年会費 " + (c.fee ? yen(c.fee) : "無料"), "sub")}</div>`).join("")}
      <div class="pn" style="margin-top:1mm">※ポイントは割引後の基本料・通話料（税抜1,000円ごと）が対象で、端末代金・事務手数料などは対象外です。${r.cards.some(c => c.id === "platinum") ? "PLATINUMの20%は入会初年度の率で、2年目以降はカードのご利用額により10〜20%です。" : ""}${r.cards.some(c => c.sel) ? "" : "割引はカードで料金をお支払いの場合で、上の合計には入っていません。"}</div></div>` : "";
    const poiBox = r.poikatsu ? `<div class="psteps">▶ <b>ポイ活の還元</b>を上限（${r.poikatsu.cap.toLocaleString()}pt）まで貯めた場合、<b>実質 約 ${yen(r.poikatsu.jisshitsu)}</b>／月<span style="font-size:9pt">（d払い・dカードのお買い物の${r.poikatsu.rate}%を還元。月 約${yen(r.poikatsu.need)}のお買い物で上限。期間・用途限定ポイント）</span></div>` : "";
    const sec3 = `<div class="sec"><h3>③ 端末</h3>
      ${dv ? `<div class="dn">${esc(dv.name)}</div>`
        + rw("買い方", payName(dv))
        + rw("端末代金（頭金込み）", dv.total !== null ? yen(dv.total) : "—")
        + (dv.atama !== null ? rw("うち頭金（当日お支払い）", yen(dv.atama), "sub") : "")
        + (Number(l.device.shitadori) ? rw("下取り", "▲" + yen(l.device.shitadori), "dc") : "")
        + (Number(l.device.point) ? rw("ポイント利用", "▲" + Number(l.device.point).toLocaleString() + "pt", "dc") : "")
        + (dv.zanka ? rw("24回目のお支払い（残価）", yen(dv.zanka)) : "")
        + (dv.return23 != null ? rw("23か月目に返却した場合のご負担", yen(dv.return23), "sub") : "")
        + (dv.monthly ? rw("③ 毎月の分割（" + dv.months + "回）", yen(dv.monthly), "st") + (dv.first ? rw("1回目のみ", yen(dv.first), "sub") : "") : "")
        : `<div class="none">端末のご購入なし</div>`}
      ${l.curModel ? rw("今お使いの機種", esc(l.curModel), "sub") : ""}</div>`;
    const sec4 = `<div class="sec"><h3>④ 初期費用</h3>
      ${r.init.some(x => x[2] === "today") ? `<h4>当日のお支払い</h4>${initRows(r, "today")}${rw("当日のお支払い 合計", yen(r.today), "st")}` : ""}
      ${r.init.some(x => x[2] === "next") ? `<h4>毎月のお支払いとは別に、翌月の請求に1回だけ加わるもの</h4>${initRows(r, "next")}` : ""}
      ${r.init.length ? "" : `<div class="none">なし</div>`}</div>`;
    return `<div class="pg">${head(N > 1 ? nm(k) : c, N > 1 ? `全${N}回線　${c}` : "")}
      <div class="cols"><div>${sec1}${sec2}</div><div>${sec3}${sec4}${cardSec}</div></div>
      <div class="totl">合計</div>${hero("毎月のお支払い（目安）", r.monthly, r.today, r.nextInit, formula)}${stepsBox(r)}${poiBox}${notes}</div>`;
  };

  const sumAll = f => rs.reduce((a, r) => a + f(r), 0);
  // --- 家族のまとめページ ---
  const famPage = () => { const anyT = sumAll(r => r.today) > 0;
    return `<div class="pg">${head(`${N}回線のまとめ`, "")}
      <table class="fam"><tr><th>回線</th><th>料金プラン／ご購入の端末</th><th class="r">毎月</th>${anyT ? `<th class="r">当日</th>` : ""}<th class="r">事務手数料など<br><small style="font-weight:400">（翌月に1回だけ加算）</small></th></tr>
      ${S.lines.map((l, k) => { const r = rs[k], p = plan(l); return `<tr><td class="nm">${nm(k)}<small>${CONTRACTS.find(x => x.id === l.contract).name}</small></td><td>${p.name}（${p.tiers[l.tier].label}）<small>${r.dev ? "端末：" + esc(r.dev.name) : "端末のご購入なし"}</small></td><td class="r"><b>${yen(r.monthly)}</b></td>${anyT ? `<td class="r">${r.today ? yen(r.today) : "—"}</td>` : ""}<td class="r">${yen(r.nextInit)}</td></tr>`; }).join("")}</table>
      <p class="pn">※回線ごとの詳しい内訳は、次のページから1回線ずつ載せています。</p>
      <div class="totl">合計</div>${hero(`毎月のお支払い（${N}回線の合計・目安）`, sumAll(r => r.monthly), sumAll(r => r.today), sumAll(r => r.nextInit))}${notes}</div>`; };

  // --- まとめて1枚 ---
  const onePage = () => {
    const cards = S.lines.map((l, k) => {
      const r = rs[k], p = plan(l), dv = r.dev, optSum = r.opts.reduce((a, b) => a + b[1], 0);
      return `<div class="card1"><div class="ch"><span>${N > 1 ? nm(k) + "　" : ""}${CONTRACTS.find(x => x.id === l.contract).name}</span><span>毎月 <b>約 ${yen(r.monthly)}</b></span></div>
        <div class="cb"><div><h5>① 料金プラン</h5>${planRows(l, r, p)}${rw("小計", yen(r.planNet + r.voice), "st")}</div>
        <div><h5>② オプション</h5>${optRows(r)}${rw("小計", yen(optSum), "st")}</div>
        <div><h5>③ 端末・④ 初期費用</h5>${dv ? `<div class="dn">${esc(dv.name)}</div>` + rw(payName(dv), dv.monthly ? yen(dv.monthly) + "×" + dv.months + "回" : (dv.total !== null ? yen(dv.total) : "—")) : `<div class="none" style="padding:1mm 0">端末のご購入なし</div>`}
          ${r.today ? rw("当日のお支払い", yen(r.today), "st") : ""}${r.nextInit ? rw("事務手数料など（翌月に1回だけ加算）", yen(r.nextInit)) : ""}</div></div></div>`;
    });
    return `<div class="pg">${head(N > 1 ? `${N}回線のお見積り` : CONTRACTS.find(x => x.id === S.lines[0].contract).name, "")}
      ${cards.join("")}<div class="totl">合計</div>${hero(`毎月のお支払い（${N > 1 ? N + "回線の合計・" : ""}目安）`, sumAll(r => r.monthly), sumAll(r => r.today), sumAll(r => r.nextInit))}${notes}</div>`;
  };

  const pages = printMode === "one" ? [onePage()] : [...(N > 1 ? [famPage()] : []), ...S.lines.map(linePage)];
  $("print").innerHTML = pages.join("");
  $("pvmode").innerHTML = N > 1 ? [["each", `1回線ずつ（まとめ＋${N}枚）`], ["one", "まとめて1枚"]].map(([v, n]) => `<button class="${printMode === v ? "on" : ""}" onclick="doPrint('${v}')">${n}</button>`).join("") : "";
  $("pvcount").textContent = `A4縦 ${pages.length}枚`;
  $("pv").classList.add("open"); document.body.classList.add("pvopen"); $("pv").scrollTop = 0;
  fitPages();
}
// 各ページをA4縦1枚（印刷できる範囲 190×277mm）に収める。はみ出す時だけ縮小
function fitPages() {
  const mm = 96 / 25.4, H = 262 * mm;
  document.querySelectorAll("#print .pg").forEach(pg => {
    let z = 1; pg.style.zoom = 1; pg.style.width = "190mm";
    for (let k = 0; k < 30; k++) {
      const h = pg.getBoundingClientRect().height;
      if (h <= H) break;
      z = Math.max(0.35, z * Math.sqrt(H / h) * 0.99); pg.style.zoom = z; pg.style.width = (190 / z) + "mm";
      if (z === 0.35) break;
    }
  });
}
$("store").innerHTML = STORES.map(s => `<option>${s}</option>`).join("");
try { const sv = localStorage.getItem("mitsumori_store"); if (sv) $("store").value = sv; } catch (e) {}
$("store").onchange = () => { try { localStorage.setItem("mitsumori_store", $("store").value); } catch (e) {} };
$("asof").textContent = "料金データ：" + DATA_AS_OF + (typeof DEVICES_AS_OF !== "undefined" ? "／機種代金：" + DEVICES_AS_OF : "");
renderNews();
render();
</script>
